name: Koersplein ISIN bronverwerking Athene en Warschau
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/isin-source-recovery.yml'
      - 'scripts/research/fetch-gpw-evidence.mjs'
      - 'scripts/research/reconcile-isin.mjs'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source matching logic
        run: npm run isin:verify
      - name: Collect official GPW identifiers (read only)
        run: |
          mkdir -p research/output/audit
          node scripts/research/fetch-gpw-evidence.mjs > research/output/audit/gpw-isin-evidence.json
      - name: Summarize validated identifiers
        if: success()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('research/output/audit/gpw-isin-evidence.json','utf8'));
          const summary='## Official GPW ISIN evidence\n\nAccepted: '+p.accepted.length+' / '+p.total+'; rejected: '+p.rejected.length+'; remaining: '+p.unresolved+'\n\nNo source catalogs or history were modified.\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
          console.log(summary);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpw-isin-evidence
          path: research/output/audit/gpw-isin-evidence.json
          if-no-files-found: warn
          retention-days: 30
