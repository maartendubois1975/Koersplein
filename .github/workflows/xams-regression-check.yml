name: XAMS isolated regression checks
on:
  pull_request:
    branches:
      - amsterdam-reset-20261027
    paths:
      - 'scripts/cloudflare/test-xams-market-page.mjs'
      - 'scripts/validate.mjs'
      - 'scripts/factory/test.mjs'
      - 'scripts/history/test-amsterdam-public-integration.mjs'
      - 'scripts/history/amsterdam-end-to-end-acceptance.mjs'
      - 'data/euronext-amsterdam.json'
      - 'data/history-instruments.json'
      - '.github/workflows/xams-regression-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Amsterdam page regression
        run: node scripts/cloudflare/test-xams-market-page.mjs
      - name: Run full test suite
        run: npm test && npm run history:test
      - name: Verify full Amsterdam catalog to browser acceptance
        run: node scripts/history/amsterdam-end-to-end-acceptance.mjs
