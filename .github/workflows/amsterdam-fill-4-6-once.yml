name: Amsterdam plus30 chain once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/amsterdam-fill-4-6-once.yml
permissions:
  contents: read
concurrency:
  group: koersplein-amsterdam-plus30-once
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Analyseer opeenvolgende plus-30 stappen
        run: node scripts/research/amsterdam-plus30-chain.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amsterdam-plus30-chain-result
          path: research/output/plus30-chain
          retention-days: 30
