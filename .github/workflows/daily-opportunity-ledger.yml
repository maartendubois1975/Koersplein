name: Dagelijkse Kansscanner
on:
  schedule:
    - cron: '15 18 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily-opportunity-ledger.yml'
permissions:
  contents: write
concurrency:
  group: koersplein-daily-opportunity-ledger
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Selecteer en volg kandidaten
        run: node scripts/research/daily-opportunity-ledger.mjs
      - name: Bewaar bevroren historie
        run: |
          git config user.name "koersplein-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/opportunity-ledger.json data/opportunity-latest.json data/opportunity-learning.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Dagelijkse Kansscanner $(date -u +%F)"
          git push origin HEAD:main
