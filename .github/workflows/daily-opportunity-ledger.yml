name: Dagelijkse Kansscanner
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily-opportunity-ledger.yml'
permissions:
  contents: write
concurrency:
  group: koersplein-daily-opportunity-ledger
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Selecteer en volg kandidaten
        run: node scripts/research/daily-opportunity-ledger.mjs
      - name: Bereken bestaande 3-maands compatibiliteitsoutput
        run: node scripts/research/top5-three-month.mjs
      - name: Publiceer live Europa 3/6/12/24 snapshots
        run: node scripts/research/publish-live-europe.mjs
      - name: Bewaar bevroren historie
        run: |
          git config user.name "koersplein-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/opportunity-ledger.json data/opportunity-latest.json data/opportunity-learning.json data/top5-three-month.json data/live-europe-latest.json data/live-europe-weekly.json data/live-meaningful-changes.json data/live-history/ 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Dagelijkse Kansscanner $(date -u +%F)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo 'Kansscanner kon canonical data na 3 pogingen niet veilig publiceren.' >&2
          exit 1
