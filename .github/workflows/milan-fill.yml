name: Milan Fill Factory
on:
  workflow_dispatch:

concurrency:
  group: milan-fill-production
  cancel-in-progress: true

jobs:
  milan-fill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Fetch official Milan catalogue
        run: node scripts/cloudflare/fetch-milan-catalog.mjs

      - name: Validate repository and Milan catalogue
        run: npm run validate

      - name: Complete Milan historical backfill
        env:
          KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
          KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
          MARKET_MIC: XMIL
          HISTORY_BATCH_SIZE: 5
          CATALOG_BATCH_SIZE: 5
          ALLOW_PARTIAL_FAILURES: 1
        run: |
          set -euo pipefail
          : > research/output/milan-rounds.jsonl
          skip_isins=""
          seed=1
          for round in $(seq 1 18); do
            echo "=== Milan batch $round/18 ==="
            export SKIP_ISINS="$skip_isins"
            if [ "$seed" -eq 1 ]; then
              timeout 240s env SEED_CATALOG=1 node scripts/cloudflare/universal-market-runner.mjs || rc=$?
              seed=0
            else
              timeout 240s env SEED_CATALOG=0 node scripts/cloudflare/universal-market-runner.mjs || rc=$?
            fi
            rc=${rc:-0}
            if [ "$rc" -eq 124 ]; then
              echo "Micro-batch timed out after 240s; stop safely and continue on the next scheduled run"
              break
            elif [ "$rc" -ne 0 ]; then
              echo "Micro-batch failed with exit code $rc"
              exit "$rc"
            fi
            rc=0

            node -e "const fs=require('fs');const r=require('./research/output/world-fill-batch.json');fs.appendFileSync('./research/output/milan-rounds.jsonl',JSON.stringify({round:$round,...r})+'\n')"
            new_failed=$(node -e "const r=require('./research/output/world-fill-batch.json');console.log((r.failed||[]).map(x=>x.isin).join(','))")
            if [ -n "$new_failed" ]; then
              skip_isins=$(printf '%s,%s' "$skip_isins" "$new_failed" | sed 's/^,//')
            fi

            remaining=$(node -e "const r=require('./research/output/world-fill-batch.json'); console.log(r.remainingHint ?? 999999)")
            complete=$(node -e "const r=require('./research/output/world-fill-batch.json'); console.log(r.complete ?? 0)")
            candidates=$(node -e "const r=require('./research/output/world-fill-batch.json'); console.log(r.candidates ?? 0)")
            echo "batch=$round complete=$complete candidates=$candidates remaining=$remaining quarantined=$skip_isins"

            if [ "$remaining" -le 0 ] || [ "$candidates" -eq 0 ]; then
              echo "Bulk backfill exhausted; moving to end validation"
              break
            fi
            if [ "$complete" -eq 0 ] && [ -z "$new_failed" ] && [ "$candidates" -gt 0 ]; then
              echo "No measurable progress; stop safely for end validation instead of hammering the Worker"
              break
            fi
          done

      - name: End validation
        if: always()
        env:
          KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
          KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
          MARKET_MIC: XMIL
        run: |
          node scripts/cloudflare/market-handoff-signal.mjs
          cp research/output/market-handoff-signal.json research/output/milan-end-validation.json
          node -e "const fs=require('fs');const rows=fs.existsSync('./research/output/milan-rounds.jsonl')?fs.readFileSync('./research/output/milan-rounds.jsonl','utf8').trim().split(/\n/).filter(Boolean).map(JSON.parse):[];const end=require('./research/output/milan-end-validation.json');const summary={generatedAt:new Date().toISOString(),rounds:rows.length,totalCompletedThisRun:rows.reduce((n,r)=>n+(r.complete||0),0),failed:[...new Map(rows.flatMap(r=>r.failed||[]).map(x=>[x.isin,x])).values()],validation:end};fs.writeFileSync('./research/output/milan-run-summary.json',JSON.stringify(summary,null,2));console.log(JSON.stringify(summary,null,2))"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milan-fill-results
          path: |
            data/euronext-milan.json
            research/output/world-fill-batch.json
            research/output/milan-rounds.jsonl
            research/output/milan-run-summary.json
            research/output/milan-end-validation.json
          retention-days: 30
