name: Milan Fill Factory
on:
  push:
    branches: [main]
    paths: ['.github/workflows/milan-fill.yml', 'scripts/cloudflare/universal-market-runner.mjs', 'scripts/cloudflare/fetch-milan-catalog.mjs', 'data/market-source-registry.json', 'data/world-fill-plan.json']
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
jobs:
  milan-fill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fetch official Milan catalogue
        run: node scripts/cloudflare/fetch-milan-catalog.mjs
      - name: Validate repository and Milan catalogue
        run: npm run validate
      - name: Complete Milan historical backfill
        env:
          KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
          KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
          MARKET_MIC: XMIL
          HISTORY_BATCH_SIZE: 20
          CATALOG_BATCH_SIZE: 25
        run: |
          for round in $(seq 1 4); do
            echo "=== Milan batch $round ==="
            if [ "$round" -eq 1 ]; then
              SEED_CATALOG=1 node scripts/cloudflare/universal-market-runner.mjs
            else
              SEED_CATALOG=0 node scripts/cloudflare/universal-market-runner.mjs
            fi
            remaining=$(node -e "const r=require('./research/output/world-fill-batch.json'); console.log(r.remainingHint ?? 999999)")
            failed=$(node -e "const r=require('./research/output/world-fill-batch.json'); console.log((r.failed||[]).length)")
            complete=$(node -e "const r=require('./research/output/world-fill-batch.json'); console.log(r.complete ?? 0)")
            echo "batch=$round complete=$complete failed=$failed remaining=$remaining"
            if [ "$remaining" -le 0 ]; then
              echo "MILAN_BACKFILL_COMPLETE"
              break
            fi
            if [ "$complete" -eq 0 ]; then
              echo "No progress; stopping to avoid a wasteful loop"
              exit 2
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milan-fill-results
          path: |
            data/euronext-milan.json
            research/output/world-fill-batch.json
          retention-days: 30
