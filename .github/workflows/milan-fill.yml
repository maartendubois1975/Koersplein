name: Milan Fill Factory
'on':
  push:
    branches: [main]
jobs:
  milan-fill:
    if: ${{ contains(github.event.head_commit.message, '[run-milan]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/import-milan.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: milan-catalog
          path: data/borsa-italiana-milan.json
