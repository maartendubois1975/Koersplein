name: Parijs validatie hervatten
on:
  push:
    branches: [main]
    paths: ['.github/workflows/paris-validation-only.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: koersplein-paris-validation
  cancel-in-progress: false
jobs:
  validate-paris:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Haal officiële Parijs-catalogus op voor validatie
        run: node scripts/cloudflare/fetch-paris-catalog.mjs
      - name: Controleer validatie-input
        run: test -s data/euronext-paris.json
      - name: Valideer bestaande Parijse koersreeksen zonder nieuwe backfill
        run: node scripts/cloudflare/validate-paris-history.mjs
      - name: Bewaar validatierapport
        if: always()
        run: |
          git config user.name "koersplein-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/euronext-paris.json research/output/paris/validation-summary.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Parijs losse historievalidatie"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Bewaar validatie-artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paris-validation-summary
          path: research/output/paris/validation-summary.json
          retention-days: 30
