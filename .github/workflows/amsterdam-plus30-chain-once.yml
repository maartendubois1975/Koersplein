name: Amsterdam plus30 chain once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amsterdam-plus30-chain-once.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Analyseer opeenvolgende plus30 kettingen
        run: node scripts/research/amsterdam-plus30-chain.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amsterdam-plus30-chain-result
          path: research/output/plus30-chain/
          retention-days: 30
# one-shot trigger 2026-09-17
