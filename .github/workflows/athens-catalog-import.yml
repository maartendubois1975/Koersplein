name: Athens verified catalog import
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/athens-catalog-import.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download verified evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38935497268 --repo ${{ github.repository }} --name athens-public-evidence --dir evidence
      - name: Apply verified identifiers and run tests
        run: |
          node scripts/research/apply-athens-verified.mjs evidence/athens-public-evidence.json
          sed -i 's/catalog.unresolved.length,147/catalog.unresolved.length,40/' scripts/cloudflare/test.mjs
          npm test
      - name: Push changes to review branch
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/verified-athens-isins
          title: 'Apply verified Athens identifiers'
          commit-message: 'Add official Athens ISIN evidence'
          add-paths: |
            data/euronext-athens.json
            scripts/cloudflare/test.mjs
