name: Amsterdam clean checks
on:
  push:
    branches:
      - amsterdam-clean-20261031
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Evaluate Amsterdam holdout diagnostics
        run: |
          node scripts/backtest-amsterdam.mjs > amsterdam-backtest.json
          cat amsterdam-backtest.json
      - name: Publish research diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: amsterdam-backtest-${{ github.sha }}
          path: amsterdam-backtest.json
          retention-days: 14
