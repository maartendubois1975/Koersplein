name: Approved European pipeline regression
on:
  push:
    branches: [consolidation-20261116]
  pull_request:
    branches: [consolidation-20261116]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: approved-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Registers, providers, immutable archive, deadline outcomes and browser integration
        run: |
          npm test
          npm run audit:codebase
          npm run history:test
          for test in scripts/research/test-*.mjs; do node "$test"; done
      - name: Verify retained Paris research selection
        run: node scripts/research/export-paris-company-review.mjs --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-regression-evidence
          path: research/output/architecture-inventory.json
