name: Paris stage recovery candidates and protect ISIN boundaries
on:
  push:
    branches: [paris-reset-20261116]
    paths: [.github/workflows/paris-stage-recovery.yml]
permissions:
  contents: read
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: paris-recovery-evidence
          run-id: 43815667481
          github-token: ${{ github.token }}
          path: research/output
      - run: node scripts/cloudflare/paris-stage-recovery.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: paris-staged-recovery
          path: research/output/paris-staged-recovery.json
