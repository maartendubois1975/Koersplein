name: Plus30 chain final once
on:
  push:
    paths:
      - '.github/workflows/plus30-chain-once-v2.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/research/run-plus30-chain.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: plus30-chain-result
          path: research/output/plus30-chain/
