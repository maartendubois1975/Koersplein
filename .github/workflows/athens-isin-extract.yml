name: Koersplein Athens verified ISIN extraction
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/athens-isin-extract.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/research/fetch-athex-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athens-isin-evidence
          path: research/output/audit/athens-isin-evidence.json
