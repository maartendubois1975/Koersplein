name: Koersplein live Europese koersdekking
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-europe-coverage.yml'
      - 'scripts/cloudflare/**'
      - 'cloudflare/worker.mjs'
      - 'market-week-core.mjs'
      - 'amsterdam-week.js'
      - 'amsterdam.html'
      - 'config/europe-backfill-request.json'
      - 'data/markets.json'
      - 'data/euronext-*.json'
permissions:
  contents: read
concurrency:
  group: koersplein-live-europe-coverage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test MIC-safe Amsterdam week renderer and audit contract
        run: |
          node --check market-week-core.mjs
          node --check amsterdam-week.js
          node --check scripts/cloudflare/audit-amsterdam-week.mjs
          node scripts/cloudflare/test-market-week-core.mjs
          node --check scripts/cloudflare/audit-amsterdam-official-sessions.mjs
          node scripts/cloudflare/audit-amsterdam-official-sessions.mjs --self-test
      - name: Audit five Amsterdam sessions in public canonical history (read-only)
        env:
          KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
        run: node scripts/cloudflare/audit-amsterdam-week.mjs
      - name: Probe missing XAMS sessions against official historical source (read-only)
        timeout-minutes: 10
        run: node scripts/cloudflare/probe-amsterdam-week-gaps.mjs
      - name: Classify missing XAMS dates using exact official daily status (read-only)
        timeout-minutes: 12
        run: node scripts/cloudflare/audit-amsterdam-official-sessions.mjs
      - name: Verify official XAMS/TNLA/XAMC listing identity (read-only)
        timeout-minutes: 3
        run: |
          node scripts/cloudflare/audit-amsterdam-mic-evidence.mjs --self-test
          node scripts/cloudflare/audit-amsterdam-mic-evidence.mjs
      - name: Verify deployed Amsterdam page and live Worker five-day rendering (read-only)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node scripts/cloudflare/audit-amsterdam-public-page.mjs
      - name: Check API configuration
        id: config
        run: |
          if [ -n "$KOERSPLEIN_API_URL" ] && [ -n "$KOERSPLEIN_FACTORY_TOKEN" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Live audit overgeslagen: KOERSPLEIN_API_URL of KOERSPLEIN_FACTORY_TOKEN ontbreekt in GitHub Secrets.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Compare live European catalog and history
        if: github.event_name == 'workflow_dispatch' && steps.config.outputs.available == 'true'
        run: |
          mkdir -p research/output/audit
          node scripts/cloudflare/audit-live.mjs > research/output/audit/live-europe-coverage.json
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('research/output/audit/live-europe-coverage.json','utf8')); console.log(JSON.stringify(r.totals)); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Live Europese koersdekking: '+JSON.stringify(r.totals)+'\\n');"
      - name: Inventariseer ontbrekende Europese koershistorie per beurs
        if: github.event_name == 'workflow_dispatch' && steps.config.outputs.available == 'true'
        run: |
          node scripts/cloudflare/europe-missing-history-inventory.mjs > research/output/audit/missing-history-log.txt
          node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('research/output/europe-missing-history-inventory.json','utf8'));console.log('Ontbrekende historie:',r.count,JSON.stringify(r.byMarket));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Ontbrekende Europese historie: '+r.count+' instrumenten\\n');"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-europe-coverage
          path: |
            research/output/audit/amsterdam-week-coverage.json
            research/output/audit/amsterdam-official-gap-probe.json
            research/output/audit/amsterdam-official-session-status.json
            research/output/audit/amsterdam-official-mic-evidence.json
            research/output/audit/live-europe-coverage.json
            research/output/europe-stale-history-inventory.json
            research/output/europe-missing-history-inventory.json
            research/output/europe-missing-history-inventory.csv
            research/output/audit/missing-history-log.txt
          retention-days: 30
