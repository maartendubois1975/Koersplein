name: Koersplein Amsterdam XAMS vijfdaagse dekking
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-europe-coverage.yml'
      - 'scripts/cloudflare/**'
      - 'scripts/history/official-daily-status.mjs'
      - 'scripts/history/providers/euronext-live.mjs'
      - 'cloudflare/worker.mjs'
      - 'market-week-core.mjs'
      - 'amsterdam-week.js'
      - 'amsterdam.html'
      - 'market.html'
      - 'market.js'
      - 'data/euronext-amsterdam.json'
      - 'data/amsterdam-no-trades-2026-10-19-23.json'
      - 'data/market-source-registry.json'
permissions:
  contents: read
concurrency:
  group: koersplein-xams-coverage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  xams-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify XAMS strict validation and official evidence gates
        run: |
          node --check market-week-core.mjs
          node --check amsterdam-week.js
          node --check scripts/cloudflare/audit-amsterdam-week.mjs
          node --check scripts/cloudflare/audit-amsterdam-official-sessions.mjs
          node scripts/cloudflare/test-market-week-core.mjs
          node scripts/cloudflare/test-xams-market-page.mjs
          node scripts/cloudflare/audit-amsterdam-official-sessions.mjs --self-test
          node scripts/cloudflare/audit-amsterdam-mic-evidence.mjs --self-test
  xams-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit public Worker canonical XAMS history for five completed sessions
        timeout-minutes: 8
        run: node scripts/cloudflare/audit-amsterdam-week.mjs
      - name: Probe exact-date official traded candidates without importing
        timeout-minutes: 12
        run: node scripts/cloudflare/probe-amsterdam-week-gaps.mjs
      - name: Verify all three official Euronext MIC directories
        timeout-minutes: 4
        run: node scripts/cloudflare/audit-amsterdam-mic-evidence.mjs
      - name: Build full dated XAMS gap evidence inventory (no data writes)
        timeout-minutes: 12
        run: node scripts/cloudflare/audit-amsterdam-official-sessions.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xams-five-day-evidence
          path: |
            research/output/audit/amsterdam-week-coverage.json
            research/output/audit/amsterdam-official-gap-probe.json
            research/output/audit/amsterdam-official-mic-evidence.json
            research/output/audit/amsterdam-official-session-status.json
            research/output/audit/amsterdam-gap-evidence.json
            research/output/audit/amsterdam-gap-evidence.csv
          retention-days: 30
  xams-public:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify both deployed Amsterdam routes and Worker/API parity
        timeout-minutes: 10
        run: node scripts/cloudflare/audit-amsterdam-public-page.mjs
