name: Parijs volledige historische vulling eenmalig
on:
  push:
    branches: [main]
    paths: ['.github/workflows/paris-full-backfill-once.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: koersplein-paris-full-backfill
  cancel-in-progress: false
jobs:
  paris-full:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Vernieuw officiële Parijs-catalogus
        run: node scripts/cloudflare/fetch-paris-catalog.mjs
      - name: Vul volledige historische Parijs-catalogus
        run: node scripts/cloudflare/paris-full-backfill.mjs
      - name: Bewaar eindrapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paris-full-backfill-summary
          path: research/output/paris/full-backfill-summary.json
          retention-days: 30
