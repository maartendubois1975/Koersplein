name: Brussel plus30 benchmark eenmalig
on:
  push:
    branches: [main]
    paths: [.github/workflows/brussels-plus30-benchmark-once.yml]
permissions:
  contents: read
concurrency:
  group: koersplein-brussels-plus30-once
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Draai identieke plus30 kansenkaart voor Brussel
        run: node scripts/research/brussels-plus30-chain.mjs
      - name: Bewaar volledige Brusselse benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brussels-plus30-benchmark
          path: research/output/brussels-plus30-chain/
          retention-days: 30
