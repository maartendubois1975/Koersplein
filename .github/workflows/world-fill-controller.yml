name: M00 Wereldvuller
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: koersplein-world-fill-controller
  cancel-in-progress: false
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controleer actieve markt en bepaal volgende actie
        run: node scripts/cloudflare/world-orchestrator.mjs
      - name: Bewaar controletoestand
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-fill-state-${{ github.run_number }}
          path: research/output/world-fill-state.json
          retention-days: 14
