name: Consolidation safety checks
on:
  push:
    branches:
      - consolidation-single-pipeline-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and ownership tests
        run: |
          node --check scripts/history.mjs
          node --check scripts/cloudflare/factory-runner.mjs
          node --check scripts/cloudflare/universal-market-runner.mjs
          node --check scripts/cloudflare/daily-open-close-update.mjs
          node --check scripts/cloudflare/reconcile-official-daily.mjs
          node --check scripts/cloudflare/import-golden.mjs
          node --check scripts/cloudflare/sync-plan.mjs
          node --check scripts/cloudflare/paris-targeted-history-recovery.mjs
          node --check scripts/factory/jobs.mjs
          node --check scripts/factory/scheduler.mjs
          node scripts/audit/test-consolidation-config.mjs
          node scripts/audit/test-writer-ownership.mjs
          node scripts/audit/test-assert-writer-authorized.mjs
          node scripts/cloudflare/test-history-writer.mjs
          node scripts/cloudflare/test-factory-policy.mjs
          node scripts/audit/test-consolidation-integration.mjs
          node scripts/history/test-session-readiness.mjs
          node scripts/audit/test-euronext-catalog-integrity.mjs
          node scripts/audit/test-euronext-cross-market.mjs
          node scripts/audit/euronext-cross-market.mjs data/euronext-amsterdam.json data/euronext-brussels.json
          node scripts/audit/euronext-catalog-integrity.mjs data/euronext-amsterdam.json data/euronext-brussels.json
          node scripts/audit/test-consolidation-plan.mjs
          node scripts/audit/test-authorize-market-shard.mjs
          node scripts/audit/consolidation-cli.mjs --writer=cloudflare-universal --market=XAMS
      - name: Existing application tests
        run: npm test && npm run history:test
