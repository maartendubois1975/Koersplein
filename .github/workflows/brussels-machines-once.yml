name: Brussel Machine 1 daarna Machine 2 eenmalig
on:
  push:
    branches: [main]
    paths: [.github/workflows/brussels-machines-once.yml]
permissions:
  contents: read
concurrency:
  group: koersplein-brussels-machines-once
  cancel-in-progress: false
jobs:
  machines:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Machine 1 - blinde historische Brussel-test
        run: node scripts/research/brussels-machine1.mjs
      - name: Machine 2 - post-mortem pas na geslaagde Machine 1
        run: node scripts/research/brussels-machine2.mjs research/output/brussels-machine1-results.jsonl
      - name: Bewaar beide testresultaten
        uses: actions/upload-artifact@v4
        with:
          name: brussels-machine1-machine2-first-run
          path: |
            research/output/brussels-machine1-summary.json
            research/output/brussels-machine1-results.jsonl
            research/output/brussels-machine2-summary.json
            research/output/brussels-machine2-postmortems.jsonl
          retention-days: 30
