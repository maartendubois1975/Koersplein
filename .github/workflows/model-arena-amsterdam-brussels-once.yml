name: Model Arena Amsterdam Brussel eenmalig
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/model-arena-amsterdam-brussels-once.yml']
permissions:
  contents: read
concurrency:
  group: koersplein-model-arena-amsterdam-brussels
  cancel-in-progress: false
jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run frozen cross-market Model Arena
        run: node scripts/research/model-arena-live.mjs
      - name: Bewaar volledig arena rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-arena-amsterdam-brussels
          path: research/output/model-arena/
          retention-days: 90