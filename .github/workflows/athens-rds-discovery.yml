name: Koersplein Athens official RDS discovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/athens-rds-discovery.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover official RDS report download endpoints
        run: |
          mkdir -p research/output/audit
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base='https://portal.athexgroup.gr/rds';
          const response=await fetch(base,{headers:{'User-Agent':'Mozilla/5.0'}});
          const html=await response.text();
          const hits=[...html.matchAll(/.{0,180}(?:LatestReports|InstrumentSeries|download|rds).{0,260}/gi)].slice(0,45).map(x=>x[0]);
          const links=[...html.matchAll(/(?:href|data-url|onclick)=["']([^"']+)["']/gi)].map(x=>x[1]).filter(x=>/rds|csv|reports|download|documents/i.test(x)).slice(0,45);
          const report={httpStatus:response.status,finalUrl:response.url,bytes:html.length,links,hits};
          fs.writeFileSync('research/output/audit/athens-rds-discovery.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athens-rds-discovery
          path: research/output/audit/athens-rds-discovery.json
