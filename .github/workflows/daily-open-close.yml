name: Dagelijkse Open Close Update
on:
  push:
    branches: [main]
    paths: ['config/europe-backfill-request.json', 'config/paris-diagnostic-request.json', 'config/paris-repair-request.json', 'config/paris-follow-policy.json']
  schedule:
    - cron: '45 18 * * 1-5'
  workflow_dispatch:
    inputs:
      full_backfill:
        description: Process every listing from 1990 without the daily missing-history limit
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
  issues: write
concurrency:
  group: koersplein-daily-open-close-v4
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  update-and-verify:
    if: github.event_name != 'push' || (!contains(github.event.head_commit.message, '[paris-diagnostic-only]') && !contains(github.event.head_commit.message, '[paris-repair-only]'))
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      EUROPE_FULL_BACKFILL: ${{ ((github.event_name == 'push' && contains(github.event.head_commit.message, '[europe-full-backfill]')) || (github.event_name == 'workflow_dispatch' && inputs.full_backfill)) && '1' || '0' }}
      EUROPE_INSTRUMENT_CONCURRENCY: '2'
      EUROPE_SHARD_COUNT: '8'
      EUROPE_SHARD_INDEX: ${{ matrix.shard }}
      KOERSPLEIN_AUTH_MODE: github-oidc
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Verify approved Europe provider routing
        run: node scripts/cloudflare/test-europe-provider-routing.mjs
      - name: Test production identity verification
        run: node scripts/cloudflare/test-github-oidc.mjs
      - name: Verify production Worker and credentials
        run: |
          node --input-type=module <<'JS'
          import {FactoryApiClient} from './scripts/cloudflare/client.mjs';
          const client=new FactoryApiClient();
          let ready=false;
          for(let attempt=0;attempt<12;attempt++){
            const r=await fetch(client.baseUrl+'/health',{signal:AbortSignal.timeout(15000)});
            const health=await r.json();
            if(r.ok&&health.historyWritePolicy==='preserve-existing-listing-v1'){ready=true;break;}
            console.log('Waiting for append-only Worker deployment',attempt+1);
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(!ready)throw Error('Worker append-only listing protection not deployed; no production writes attempted');
          await client.catalog();
          // Empty create-only batch proves mutation authorization without touching D1.
          await client.seedCatalog({markets:[],instruments:[],createOnly:true});
          console.log('FACTORY_CATALOG_WRITE_AUTH_AND_PRESERVATION_POLICY_OK');
          JS
      - name: Voeg nieuwste volledige open en slot toe aan geselecteerde beurzen
        run: node scripts/cloudflare/daily-open-close-update.mjs
      - name: Verifieer open en slot van geselecteerde beurzen
        if: always()
        run: node scripts/cloudflare/audit-daily-open-close.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-open-close-shard-${{ matrix.shard }}
          path: |
            research/output/daily-open-close-update-*.json
            research/output/daily-open-close-audit-*.json
            research/output/daily-official-status-*.json
          retention-days: 90

# Routine code merges do not enqueue production writes. Only an explicit backfill request-file change starts a full run and replaces an obsolete run.
  summary:
    needs: update-and-verify
    if: always() && needs.update-and-verify.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with:
          pattern: daily-open-close-shard-*
          path: research/output
          merge-multiple: true
      - name: Collect definitive Europe run result
        run: node scripts/cloudflare/summarize-europe-run.mjs
      - name: Publish run outcome to issue 205
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "### Europe daily run" > /tmp/europe-run-report.md
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> /tmp/europe-run-report.md
          echo "Event: ${{ github.event_name }}" >> /tmp/europe-run-report.md
          echo "Update jobs: ${{ needs.update-and-verify.result }}" >> /tmp/europe-run-report.md
          if [ -f research/output/europe-run-summary.json ]; then
            echo 'Summary JSON:' >> /tmp/europe-run-report.md
            echo '\`\`\`json' >> /tmp/europe-run-report.md
            head -c 12000 research/output/europe-run-summary.json >> /tmp/europe-run-report.md
            echo '' >> /tmp/europe-run-report.md
            echo '\`\`\`' >> /tmp/europe-run-report.md
          else
            echo 'Summary file missing; inspect run jobs.' >> /tmp/europe-run-report.md
          fi
          gh issue comment 205 --repo "${{ github.repository }}" --body-file /tmp/europe-run-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-run-summary
          path: research/output/europe-run-summary.json
          retention-days: 90

  paris-readonly-diagnostic:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[paris-diagnostic-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KOERSPLEIN_AUTH_MODE: github-oidc
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Diagnose Paris storage with authorized daily workflow identity
        run: node scripts/cloudflare/paris-storage-diagnostic.mjs
      - name: Probe actual Euronext history source for each missing Paris listing
        run: node scripts/cloudflare/paris-source-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paris-storage-diagnostic
          path: |
            research/output/paris-53-storage-diagnostic.json
            research/output/paris-source-probe.json
          retention-days: 30
      - name: Publish read-only diagnostic summary to issue 205
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS' > /tmp/paris-report.md
          import fs from 'node:fs';
          const p='research/output/paris-53-storage-diagnostic.json';
          console.log('### Paris diagnostic from authorized daily workflow');
          console.log('Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}');
          if(!fs.existsSync(p)){console.log('Diagnostic failed; see logs.');process.exit(0)}
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          console.log('Official:',d.officialParisCount,'Missing:',d.missingParisCount,'Factory access:',d.factoryCatalogAvailable);
          console.log('\\n| Classification | Count |\\n|---|---:|');
          for(const [k,v] of Object.entries(d.counts||{}))console.log('| '+k+' | '+v+' |');
          const q='research/output/paris-source-probe.json';
          if(fs.existsSync(q)){
            const p=JSON.parse(fs.readFileSync(q,'utf8'));
            console.log('\\n### Per-listing Euronext source probe ('+p.start+' through '+p.today+')');
            for(const [k,v] of Object.entries(p.counts))console.log('- '+k+': '+v);
            console.log('Instrument-level results in artifact paris-source-probe.json');
          }
          JS
          gh issue comment 205 --repo "${{ github.repository }}" --body-file /tmp/paris-report.md

  paris-targeted-repair:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[paris-repair-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      KOERSPLEIN_AUTH_MODE: github-oidc
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
      PARIS_REPAIR_ONLY: '1'
      EUROPE_SHARD_COUNT: '1'
      EUROPE_SHARD_INDEX: '0'
      EUROPE_INSTRUMENT_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Verify protected append-only production Worker
        run: |
          node --input-type=module <<'JS'
          import {FactoryApiClient} from './scripts/cloudflare/client.mjs';
          const client=new FactoryApiClient();
          const r=await fetch(client.baseUrl+'/health',{signal:AbortSignal.timeout(15000)});
          const h=await r.json();
          if(!r.ok||h.historyWritePolicy!=='preserve-existing-listing-v1')throw Error('Production append-only protection unavailable');
          await client.catalog();
          console.log('PARIS_REPAIR_PREFLIGHT_OK');
          JS
      - name: Recover only Paris listings missing stored history
        run: node scripts/cloudflare/daily-open-close-update.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paris-targeted-repair-report
          path: research/output/daily-open-close-update-*.json
          retention-days: 90
      - name: Publish targeted repair result to issue 205
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS' > /tmp/paris-repair.md
          import fs from 'node:fs';
          console.log('### Paris targeted append-only repair');
          console.log('Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}');
          const p='research/output/daily-open-close-update-0-attempt-'+(process.env.GITHUB_RUN_ATTEMPT||'1')+'.json';
          if(!fs.existsSync(p)){console.log('Repair failed before report creation; inspect run logs.');process.exit(0)}
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          for(const m of d.markets||[]){
            console.log('Market:',m.mic,'Selected:',m.catalog,'Advanced:',m.advanced,'Failed:',m.failed?.length||0,'No-trade:',m.verifiedNoTrades);
            console.log('Failure categories:',JSON.stringify((m.failed||[]).reduce((a,x)=>(a[x.category]=(a[x.category]||0)+1,a),{})));
          }
          JS
          gh issue comment 205 --repo "${{ github.repository }}" --body-file /tmp/paris-repair.md
