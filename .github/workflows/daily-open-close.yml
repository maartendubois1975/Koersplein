name: Dagelijkse Open Close Update
on:
  schedule:
    - cron: '45 18 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: koersplein-daily-open-close-v4
  cancel-in-progress: false
jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      EUROPE_SHARD_COUNT: '8'
      EUROPE_SHARD_INDEX: ${{ matrix.shard }}
      KOERSPLEIN_AUTH_MODE: github-oidc
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Test production identity verification
        run: node scripts/cloudflare/test-github-oidc.mjs
      - name: Verify factory credentials before long-running update
        run: |
          node --input-type=module <<'JS'
          import {FactoryApiClient} from './scripts/cloudflare/client.mjs';
          import {verifyGithubIdentity} from './cloudflare/github-oidc.mjs';
          import fs from 'node:fs/promises';
          const client = new FactoryApiClient();
          const token = await client.credentials();
          const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
          console.log('OIDC_SCOPE_CHECK', JSON.stringify({
            repository: claims.repository === 'maartendubois1975/Koersplein',
            repositoryId: claims.repository_id === '1369316270',
            ownerId: claims.repository_owner_id === '305800938',
            main: claims.ref === 'refs/heads/main',
            workflow: claims.workflow_ref === 'maartendubois1975/Koersplein/.github/workflows/daily-open-close.yml@refs/heads/main',
            reusable: claims.job_workflow_ref !== undefined,
            hosted: claims.runner_environment === 'github-hosted',
            lifetime: claims.exp - claims.iat,
            verified: await verifyGithubIdentity(token)
          }));
          const runtime = JSON.parse(await fs.readFile('data/runtime-config.json','utf8')).apiBaseUrl;
          for (const base of new Set([client.baseUrl,runtime])) {
            const response = await fetch(base+'/health');
            console.log('WORKER_HEALTH', base === runtime ? 'runtime-config' : 'actions-config', response.status, await response.text());
            const factory = await fetch(base+'/api/factory/catalog', {headers:{authorization:'Bearer '+token}});
            console.log('WORKER_AUTH', base === runtime ? 'runtime-config' : 'actions-config', factory.status);
          }
          JS
          node --input-type=module -e "import {FactoryApiClient} from './scripts/cloudflare/client.mjs'; try { await new FactoryApiClient().catalog(); console.log('FACTORY_AUTH_OK'); } catch(e) { console.error('FACTORY_AUTH_FAILED: '+e.message); process.exit(1); }"
      - name: Voeg nieuwste volledige open en slot toe aan geselecteerde beurzen
        run: node scripts/cloudflare/daily-open-close-update.mjs
      - name: Verifieer open en slot van geselecteerde beurzen
        if: always()
        run: node scripts/cloudflare/audit-daily-open-close.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-open-close-shard-${{ matrix.shard }}
          path: |
            research/output/daily-open-close-update-*.json
            research/output/daily-open-close-audit-*.json
          retention-days: 90

# Only scheduled/manual invocations write production history; code merges do not enqueue redundant jobs.
