name: Dagelijkse Open Close Update
on:
  push:
    branches: [main]
    paths: ['config/europe-backfill-request.json']
  schedule:
    - cron: '45 18 * * 1-5'
  workflow_dispatch:
    inputs:
      full_backfill:
        description: Process every listing from 1990 without the daily missing-history limit
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: koersplein-daily-open-close-v4
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      EUROPE_FULL_BACKFILL: ${{ (github.event_name == 'push' || inputs.full_backfill) && '1' || '0' }}
      EUROPE_INSTRUMENT_CONCURRENCY: '2'
      EUROPE_SHARD_COUNT: '8'
      EUROPE_SHARD_INDEX: ${{ matrix.shard }}
      KOERSPLEIN_AUTH_MODE: github-oidc
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Test production identity verification
        run: node scripts/cloudflare/test-github-oidc.mjs
      - name: Verify production Worker and credentials
        run: |
          node --input-type=module <<'JS'
          import {FactoryApiClient} from './scripts/cloudflare/client.mjs';
          const client=new FactoryApiClient();
          let ready=false;
          for(let attempt=0;attempt<12;attempt++){
            const r=await fetch(client.baseUrl+'/health',{signal:AbortSignal.timeout(15000)});
            const health=await r.json();
            if(r.ok&&health.historyWritePolicy==='preserve-existing-listing-v1'){ready=true;break;}
            console.log('Waiting for append-only Worker deployment',attempt+1);
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(!ready)throw Error('Worker append-only listing protection not deployed; no production writes attempted');
          await client.catalog();
          console.log('FACTORY_AUTH_AND_PRESERVATION_POLICY_OK');
          JS
      - name: Voeg nieuwste volledige open en slot toe aan geselecteerde beurzen
        run: node scripts/cloudflare/daily-open-close-update.mjs
      - name: Verifieer open en slot van geselecteerde beurzen
        if: always()
        run: node scripts/cloudflare/audit-daily-open-close.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-open-close-shard-${{ matrix.shard }}
          path: |
            research/output/daily-open-close-update-*.json
            research/output/daily-open-close-audit-*.json
            research/output/daily-official-status-*.json
          retention-days: 90

# Routine code merges do not enqueue production writes. Only an explicit backfill request-file change starts a full run and replaces an obsolete run.
  summary:
    needs: update-and-verify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with:
          pattern: daily-open-close-shard-*
          path: research/output
          merge-multiple: true
      - name: Collect definitive Europe run result
        run: node scripts/cloudflare/summarize-europe-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-run-summary
          path: research/output/europe-run-summary.json
          retention-days: 90
