name: Europe daily closing-price probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/europe-close-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/audit/europe-daily-close-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-close-20261016
          path: research/output/audit/europe-daily-close-20261016.json
