name: Amsterdam one-time permanent history storage
on:
  push:
    branches:
      - amsterdam-reset-20261027
    paths:
      - '.github/workflows/amsterdam-persist.yml'
jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import all 80 verified Amsterdam price histories
        run: node scripts/history.mjs update --all --batch-size 10
      - name: Verify all histories and daily open-close changes
        run: node scripts/history/audit-amsterdam-import.mjs
      - name: Persist verified Amsterdam history on the work branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/history/*.json
          git add data/amsterdam-import-audit.json
          git diff --cached --quiet || git commit -m "Persist 80 validated Amsterdam historical OHLC series"
          git push
