name: Parijs 54 probleemreeksen repareren
on:
  push:
    branches: [main]
    paths: ['.github/workflows/paris-repair-invalid.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: koersplein-paris-repair-invalid
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Vernieuw Parijs-catalogus
        run: node scripts/cloudflare/fetch-paris-catalog.mjs
      - name: Repareer uitsluitend afgekeurde reeksen
        run: node scripts/cloudflare/paris-repair-invalid.mjs
      - name: Valideer Parijs opnieuw met retries
        run: node scripts/cloudflare/validate-paris-history.mjs
      - name: Bewaar reparatie en validatie
        if: always()
        run: |
          git config user.name "koersplein-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/euronext-paris.json research/output/paris/repair-invalid-summary.json research/output/paris/validation-summary.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Repareer en valideer resterende Parijs-reeksen"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Bewaar rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paris-repair-invalid
          path: research/output/paris/
          retention-days: 30
