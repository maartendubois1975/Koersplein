name: Amsterdam opportunity benchmark permanent opslaan

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/amsterdam-opportunity-benchmark-save-once.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bereken volledige onafhankelijke +30 ketting
        run: node scripts/research/amsterdam-plus30-chain.mjs
      - name: Maak vaste 3 6 9 12 24 maanden benchmark
        run: |
          mkdir -p research/opportunity-benchmark/amsterdam
          cp research/output/plus30-chain/events.json research/opportunity-benchmark/amsterdam/plus30-events.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const events=JSON.parse(fs.readFileSync('research/output/plus30-chain/events.json','utf8'));
          const horizons=[['3m',90],['6m',180],['9m',270],['12m',365],['24m',730]];
          const result={generatedAt:new Date().toISOString(),market:'Euronext Amsterdam',mic:'XAMS',thresholdPct:30,stocksAnalyzed:124,methodology:'Independent +30% chain: first close >= 1.30 x current base is one event and becomes the next base; horizon uses calendar days. This prevents one continuing rally from being counted repeatedly.',totalIndependentEventsAllDurations:events.length,horizons:{}};
          for(const [name,days] of horizons){
            const hits=events.filter(e=>e.daysTo30<=days);
            const stocks=new Set(hits.map(e=>e.ticker));
            const sorted=hits.map(e=>e.daysTo30).sort((a,b)=>a-b);
            const mid=Math.floor(sorted.length/2);
            const median=sorted.length?(sorted.length%2?sorted[mid]:(sorted[mid-1]+sorted[mid])/2):null;
            const counts={}; for(const e of hits) counts[e.ticker]=(counts[e.ticker]||0)+1;
            result.horizons[name]={maxCalendarDays:days,independentEvents:hits.length,uniqueStocks:stocks.size,shareOf124StocksPct:Number((stocks.size/124*100).toFixed(2)),shareOfAllChainEventsPct:Number((hits.length/events.length*100).toFixed(2)),medianDaysTo30:median,topStocks:Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,25).map(([ticker,eventCount])=>({ticker,eventCount}))};
          }
          fs.writeFileSync('research/opportunity-benchmark/amsterdam/plus30-summary.json',JSON.stringify(result,null,2)+'\n');
          NODE
          cat > research/opportunity-benchmark/amsterdam/README.md <<'EOF'
          # Amsterdam Opportunity Benchmark — +30%

          Permanente historische benchmark voor de vraag hoe vaak een aandeel op Euronext Amsterdam een onafhankelijke stijging van minimaal 30% realiseerde.

          Horizons: 3, 6, 9, 12 en 24 maanden. `plus30-summary.json` bevat de harde totalen; `plus30-events.json` bevat alle individuele onafhankelijke events met aandeel, ISIN, startdatum/startkoers, eerste hitdatum/hitkoers en dagen tot +30%.

          Definitie: zodra de eerste slotkoers minimaal 1,30× de actuele basis bereikt, wordt één event vastgelegd en wordt die hitkoers de nieuwe basis. Daardoor telt één doorlopende rally niet telkens opnieuw als dezelfde kans.
          EOF
      - name: Sla benchmark permanent op in Koersplein
        run: |
          git config user.name "koersplein-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/opportunity-benchmark/amsterdam
          git commit -m "Bewaar Amsterdam +30 opportunity benchmark permanent" || exit 0
          git push origin HEAD:main
