name: Paris Research Factory
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional reproducible run id
        required: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/paris-research.yml'
      - 'scripts/research/**'
      - 'scripts/cloudflare/client.mjs'
      - 'cloudflare/worker.mjs'
      - 'data/research/paris-events-v1.json'
      - 'data/euronext-paris.json'

concurrency:
  group: paris-research-production
  cancel-in-progress: false

jobs:
  paris-research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run validate
      - run: npm run research:paris:test
      - name: Build official point-in-time macro dataset
        run: npm run research:paris:events

      - name: Build one bounded Paris history snapshot
        env:
          KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
          KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
          KOERSPLEIN_RESEARCH_DIR: var/research
          KOERSPLEIN_SNAPSHOT_CONCURRENCY: 1
          KOERSPLEIN_SNAPSHOT_RETRIES: 6
        run: node scripts/research/build-paris-snapshot.mjs

      - name: Run complete Paris research from local snapshot
        env:
          KOERSPLEIN_PARIS_SNAPSHOT_DIR: var/research/paris-v1/snapshot
          KOERSPLEIN_RESEARCH_EVENTS_FILE: data/research/paris-events-v1.json
          KOERSPLEIN_RESEARCH_RUN_ID: ${{ inputs.run_id }}
        run: npm run research:paris:full

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paris-research-results
          path: var/research/paris-v1/
          retention-days: 30
