name: Amsterdam daily history refresh (staging)
on:
  push:
    branches:
      - amsterdam-reset-20261027
    paths:
      - .github/amsterdam-dry-run-trigger.txt
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test provider import and audits without committing updated prices'
        required: false
        default: true
        type: boolean
permissions:
  contents: write
concurrency:
  group: amsterdam-daily-history
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/amsterdam-reset-20261027')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Amsterdam research programs before provider calls
        run: |
          node --check scripts/research/amsterdam-structural-integrity-audit.mjs
          node --check scripts/research/amsterdam-data-provenance-audit.mjs
          node --check scripts/research/amsterdam-history-quality-audit.mjs
          node --check scripts/research/amsterdam-consolidated-quality-gate.mjs
          node --check scripts/research/amsterdam-portfolio-diagnostic.mjs
          node --check scripts/research/amsterdam-portfolio-simulator.mjs
          node --check scripts/research/test-amsterdam-portfolio-simulator.mjs
      - name: Audit committed Amsterdam baseline before provider refresh
        run: |
          node scripts/research/amsterdam-structural-integrity-audit.mjs
          node scripts/research/amsterdam-data-provenance-audit.mjs
          node scripts/research/amsterdam-history-quality-audit.mjs
          node scripts/research/amsterdam-consolidated-quality-gate.mjs
      - name: Preserve immutable baseline audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: amsterdam-committed-baseline-audits
          path: |
            research/output/amsterdam-structural-integrity-audit.json
            research/output/amsterdam-data-provenance-audit.json
            research/output/amsterdam-history-quality-audit.json
            research/output/amsterdam-issuer-investigation-cases.json
            research/output/amsterdam-consolidated-quality-gate.json
          retention-days: 30
      - name: Compare latest dates with official Euronext historical source
        if: github.event_name == 'push' || inputs.dry_run == true
        run: node scripts/history/diagnose-amsterdam-freshness.mjs
      - name: Check five dual-listed instruments across official venues
        if: github.event_name == 'push'
        run: node scripts/history/diagnose-five-amsterdam.mjs
      - name: Refresh only mapped Amsterdam daily OHLC histories
        id: refresh
        continue-on-error: true
        run: node scripts/history.mjs update --all --batch-size 8
      - name: Validate all histories and Amsterdam browser integration
        run: npm test && npm run history:test
      - name: Test research-only Amsterdam portfolio simulator
        run: node scripts/research/test-amsterdam-portfolio-simulator.mjs
      - name: Audit raw Amsterdam OHLC structural integrity
        run: node scripts/research/amsterdam-structural-integrity-audit.mjs
      - name: Audit historical price provenance before model research
        run: node scripts/research/amsterdam-data-provenance-audit.mjs
      - name: Audit Amsterdam history for suspicious corporate actions and gaps
        run: node scripts/research/amsterdam-history-quality-audit.mjs
          node scripts/research/amsterdam-consolidated-quality-gate.mjs
      - name: Publish audit evidence as downloadable GitHub Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amsterdam-research-data-audits
          path: |
            research/output/amsterdam-structural-integrity-audit.json
            research/output/amsterdam-data-provenance-audit.json
            research/output/amsterdam-history-quality-audit.json
            research/output/amsterdam-issuer-investigation-cases.json
            research/output/amsterdam-consolidated-quality-gate.json
          if-no-files-found: warn
          retention-days: 30
      - name: Show prioritized issuer investigations in run summary
        if: always()
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const file='research/output/amsterdam-history-quality-audit.json';
          if(!fs.existsSync(file))process.exit(0);
          const report=JSON.parse(fs.readFileSync(file,'utf8'));
          const lines=['','### Highest-priority unverified price movements','','| ISIN | Date | Ratio | Days between records |','|---|---|---:|---:|'];
          for(const x of (report.reviewQueue||[]).slice(0,12))lines.push(`| ${x.isin} | ${x.date} | ${Number(x.ratio).toFixed(3)} | ${x.calendarDaysBetweenObservations??'?'} |`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          EOF
      - name: Assess Amsterdam readiness for blind prediction exams
        if: false # PAUSED: historical price provenance and point-in-time universe are unverified
        run: node scripts/research/amsterdam-readiness.mjs
      - name: Run Amsterdam point-in-time baseline research exam
        if: false # PAUSED: historical price provenance and point-in-time universe are unverified
        run: node scripts/research/amsterdam-machine1.mjs
      - name: Run hindsight postmortem without changing frozen predictions
        if: false # PAUSED: historical price provenance and point-in-time universe are unverified
        run: node scripts/research/amsterdam-machine2.mjs research/output/amsterdam-machine1-results.jsonl
      - name: Judge baseline with chronological folds and untouched holdout
        if: false # PAUSED: historical price provenance and point-in-time universe are unverified
        run: node scripts/research/amsterdam-baseline-judge.mjs
      - name: Compare five exploratory Amsterdam price models
        if: false # PAUSED: historical price provenance and point-in-time universe are unverified
        run: node scripts/research/amsterdam-model-arena.mjs
      - name: Simulate Amsterdam historical portfolio in research mode
        if: false # PAUSED: historical price provenance and point-in-time universe are unverified
        run: node scripts/research/amsterdam-portfolio-diagnostic.mjs
      - name: Audit latest Amsterdam trading session and percentage changes
        run: node scripts/history/check-amsterdam-latest-session.mjs
      - name: Require a clean provider refresh before publishing
        if: github.event_name != 'push' && inputs.dry_run != true && steps.refresh.outcome != 'success'
        run: |
          echo 'Provider refresh had errors; refusing to publish any partial daily update.' >&2
          exit 1
      - name: Summarize provider refresh and public data checks
        if: always()
        run: |
          echo '## Amsterdam daily history refresh' >> "$GITHUB_STEP_SUMMARY"
          echo 'Provider outcome: ${{ steps.refresh.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Audit outcome: ${{ job.status }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Dry run: ${{ inputs.dry_run }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Block publishing historical files until source evidence is verified
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const root='research/output/';
          const structural=JSON.parse(fs.readFileSync(root+'amsterdam-structural-integrity-audit.json','utf8'));
          const quality=JSON.parse(fs.readFileSync(root+'amsterdam-history-quality-audit.json','utf8'));
          const provenance=JSON.parse(fs.readFileSync(root+'amsterdam-data-provenance-audit.json','utf8'));
          const problems=[];
          if(structural.issues?.length)problems.push('structural='+structural.issues.length);
          if(quality.reviewQueue?.length)problems.push('unverified-jumps='+quality.reviewQueue.length);
          if(provenance.summary?.unverifiedAdjustment)problems.push('unverified-adjustments='+provenance.summary.unverifiedAdjustment);
          if(provenance.summary?.unverifiedCompleteness)problems.push('unverified-completeness='+provenance.summary.unverifiedCompleteness);
          if(problems.length){console.error('Publication blocked: '+problems.join(', '));process.exit(1)}
          EOF
      - name: Commit only audited historical data
        if: success() && steps.refresh.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.dry_run == false
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/history/*.json
          git add data/amsterdam-import-audit.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'data: refresh audited Amsterdam daily history'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
