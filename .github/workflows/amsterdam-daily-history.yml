name: Amsterdam daily history refresh (staging)
on:
  workflow_dispatch:
  schedule:
    - cron: '20 19 * * 1-5'
      timezone: 'Europe/Amsterdam'
permissions:
  contents: write
concurrency:
  group: amsterdam-daily-history
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh only mapped Amsterdam daily OHLC histories
        run: node scripts/history.mjs update --all --batch-size 8
      - name: Validate all histories and Amsterdam browser integration
        run: npm test && npm run history:test
      - name: Commit only audited historical data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/history/*.json
          git add data/amsterdam-import-audit.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'data: refresh audited Amsterdam daily history'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
