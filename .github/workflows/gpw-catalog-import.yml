name: Koersplein GPW verified catalog import
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gpw-catalog-import.yml'
permissions:
  contents: write
  pull-requests: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download previously verified official evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38932704267 --repo ${{ github.repository }} --name gpw-isin-evidence --dir evidence
      - name: Apply verified identities without modifying history
        run: |
          node scripts/research/apply-gpw-verified.mjs evidence/gpw-isin-evidence.json
          npm test
      - name: Create reviewable catalog update
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/verified-gpw-isins
          title: 'Populate 393 verified Warsaw ISINs from official GPW'
          commit-message: 'Populate verified official GPW identifiers'
          body: 'Official GPW evidence from successful GitHub Actions run 38932704267; only identity fields, no price history modifications.'
          add-paths: data/euronext-warsaw.json
