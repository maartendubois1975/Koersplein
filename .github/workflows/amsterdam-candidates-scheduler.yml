name: Amsterdam candidate collection (development only)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: amsterdam-candidates
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated Amsterdam development branch
        uses: actions/checkout@v4
        with:
          ref: amsterdam-clean-20261031
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect, verify and import missing Amsterdam sessions
        run: |
          node scripts/run-amsterdam-daily.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/history/
          if ! git diff --cached --quiet; then
            git commit -m 'Append verified Amsterdam historical sessions'
            git push origin HEAD:amsterdam-clean-20261031
          fi
      - name: Preserve candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amsterdam-candidates-${{ github.run_id }}
          path: |
            amsterdam-candidates.json
            amsterdam-summary.json
            amsterdam-verified.json
            amsterdam-import.json
          if-no-files-found: warn
          retention-days: 14
