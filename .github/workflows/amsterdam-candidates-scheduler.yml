name: Amsterdam candidate collection (development only)
on:
  schedule:
    - cron: '15 19 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: amsterdam-candidates
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated Amsterdam development branch
        uses: actions/checkout@v4
        with:
          ref: amsterdam-clean-20261031
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect read-only Euronext candidates
        run: node scripts/fetch-amsterdam.mjs auto amsterdam-candidates.json
      - name: Check coverage for all 80 instruments
        if: always()
        run: |
          if [ -f amsterdam-candidates.json ]; then node scripts/report-amsterdam.mjs amsterdam-candidates.json | tee amsterdam-summary.json; fi
      - name: Preserve candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amsterdam-candidates-${{ github.run_id }}
          path: amsterdam-candidates.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save latest raw report to isolated audit branch
        if: always()
        run: |
          if [ ! -f amsterdam-candidates.json ]; then exit 0; fi
          cp amsterdam-candidates.json "$RUNNER_TEMP/amsterdam-latest.json"
          git fetch origin amsterdam-daily-reports
          git checkout -B amsterdam-daily-reports origin/amsterdam-daily-reports
          mkdir -p reports
          cp "$RUNNER_TEMP/amsterdam-latest.json" reports/latest.json
          session=$(node -p "require('./reports/latest.json').date")
          if [[ "$session" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            mkdir -p reports/sessions
            cp reports/latest.json "reports/sessions/$session.json"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/latest.json reports/sessions
          if ! git diff --cached --quiet; then
            git commit -m 'Update latest Amsterdam read-only candidate audit'
            git push origin HEAD:amsterdam-daily-reports
          fi
