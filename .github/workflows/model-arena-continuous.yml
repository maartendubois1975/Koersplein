name: Model Arena continu onderzoek

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: koersplein-model-arena-continuous
  cancel-in-progress: false

jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      RESEARCH_MODE: XAMS_XBRU_COMBINED
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Draai Amsterdam, Brussel en gecombineerde cross-market Arena
        run: node scripts/research/model-arena-live.mjs
      - name: Research Director maakt publiek machinerapport en volgende agenda
        run: node scripts/research/publish-research-lab.mjs
      - name: Bewaar volledig intern onderzoeksrapport
        uses: actions/upload-artifact@v4
        with:
          name: model-arena-continuous-${{ github.run_number }}
          path: research/output/model-arena/
          retention-days: 90
      - name: Publiceer alleen betekenisvol Research Lab checkpoint
        run: |
          git config user.name "Koersplein Research Director"
          git config user.email "research-director@users.noreply.github.com"
          git add data/research-lab/latest.json data/research-lab/archive.json
          if git diff --cached --quiet; then
            echo "Geen nieuw machinerapport om te publiceren."
            exit 0
          fi
          git commit -m "Research Lab: dagelijkse Model Arena uitslag"
          git push origin HEAD:main
