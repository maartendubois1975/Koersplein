name: Autonome Research Director

on:
  workflow_run:
    workflows: ['Model Arena continu onderzoek']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: koersplein-autonomous-research-director
  cancel-in-progress: false

jobs:
  direct:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Selecteer maximaal één volgend experiment binnen budget
        run: node scripts/research/autonomous-director.mjs | tee director.log
      - name: Voer geselecteerd gecontroleerd experiment uit
        run: |
          ID=$(grep '^EXPERIMENT_ID=' director.log | tail -1 | cut -d= -f2 || true)
          if [ -z "$ID" ]; then echo 'Geen experiment: stopstaat/budget.'; exit 0; fi
          echo "Research Director start $ID"
          EXPERIMENT_ID="$ID" node scripts/research/model-arena-live.mjs
          node scripts/research/publish-research-lab.mjs
      - name: Bewaar Research Director staat en nieuw rapport
        run: |
          git config user.name "Koersplein Research Director"
          git config user.email "research-director@users.noreply.github.com"
          git add data/research-lab/director-state.json data/research-lab/latest.json data/research-lab/archive.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Research Director: autonoom onderzoekscheckpoint"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Bewaar intern experimentrapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-research-${{ github.run_number }}
          path: |
            research/output/model-arena/
            director.log
          retention-days: 90
