name: Paris official inventory snapshot (read only)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/paris-official-inventory-snapshot.yml'
permissions:
  contents: read
jobs:
  official-paris-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch official Euronext Paris directory export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p paris-export
          URL='https://live.euronext.com/en/product_directory/data/stocks-paris/download?mics=XPAR%2CALXP%2CXMLI%2CMLXP%2CTNLP%2CENXP'
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 \
            --user-agent 'Mozilla/5.0 (compatible; Koersplein-Paris-inventory-audit/1.0)' \
            --dump-header paris-export/headers.txt \
            --output paris-export/euronext-paris-raw \
            "$URL"
          file paris-export/euronext-paris-raw | tee paris-export/file-type.txt
          wc -c paris-export/euronext-paris-raw | tee paris-export/size.txt
          sha256sum paris-export/euronext-paris-raw | tee paris-export/sha256.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('paris-export/euronext-paris-raw')
          head=p.read_bytes()[:256]
          if not head or b'<html' in head.lower() or b'<!doctype html' in head.lower():
              raise SystemExit('Official endpoint returned empty content or an HTML page instead of export; reject')
          print('PARIS_EXPORT_DOWNLOAD_RECEIVED',len(p.read_bytes()))
          PY
      - name: Upload source evidence (no production writes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paris-official-export-evidence
          path: paris-export/
          retention-days: 30
