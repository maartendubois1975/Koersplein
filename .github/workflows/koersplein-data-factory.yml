name: Koersplein datafabriek

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: Wat moet Koersplein uitvoeren?
        required: true
        default: AMSTERDAM_REPAIR
        type: choice
        options: [AMSTERDAM_REPAIR]
  push:
    branches: [main]
    paths:
      - '.github/workflows/koersplein-data-factory.yml'

permissions:
  contents: read

concurrency:
  group: koersplein-amsterdam-history
  cancel-in-progress: false

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchroniseer Amsterdam-catalogus
        run: node scripts/cloudflare/seed-catalog.mjs
      - name: Repareer de 15 Amsterdam-uitzonderingen
        run: node scripts/cloudflare/amsterdam-backfill.mjs --isins=BE0003851681,VGG885761301,FR001400J770,NL0000285278,KYG137071075,NL0000345627,NL0006294274,GG00BMB5XZ39,BMG455841020,NL0015000HT4,NL0000378669,BE0003720340,GG00B1RMC548,BE0003754687,BE0974349814 --strict=true
