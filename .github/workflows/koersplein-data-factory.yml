name: Koersplein datafabriek

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: Wat moet Koersplein uitvoeren?
        required: true
        default: AMSTERDAM_HISTORY
        type: choice
        options: [AMSTERDAM_HISTORY]
  push:
    branches: [main]
    paths:
      - '.github/workflows/koersplein-data-factory.yml'

permissions:
  contents: read

concurrency:
  group: koersplein-amsterdam-history
  cancel-in-progress: false

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchroniseer Amsterdam-catalogus
        run: node scripts/cloudflare/seed-catalog.mjs
      - name: Canary - 2 aandelen
        run: node scripts/cloudflare/amsterdam-backfill.mjs --offset=0 --limit=2 --strict=true
      - name: Vul heel Amsterdam door
        run: node scripts/cloudflare/amsterdam-backfill.mjs --offset=2 --limit=250 --strict=false

# Eerste automatische Amsterdam-run geactiveerd nadat GitHub Actions is ingeschakeld.
