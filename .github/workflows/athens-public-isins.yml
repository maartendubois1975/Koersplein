name: Athens public official ISIN reconciliation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/athens-public-isins.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/research/fetch-athens-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athens-public-evidence
          path: research/output/audit/athens-public-evidence.json
