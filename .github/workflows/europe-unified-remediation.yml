name: Europe unified 120 remediation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/europe-unified-remediation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: europe-unified-120-research
  cancel-in-progress: false
jobs:
  research-and-classify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/cloudflare/europe-unified-remediation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-unified-120-remediation-report
          path: |
            research/output/europe-unified-120-remediation.json
            research/output/europe-unified-120-remediation.md
          retention-days: 90
