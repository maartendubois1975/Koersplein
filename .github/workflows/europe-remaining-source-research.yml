name: Europe remaining 18 missing source research
on:
  push:
    branches: [main]
    paths: ['.github/workflows/europe-remaining-source-research.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EUROPE_PROBE_SCOPE: remaining
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/cloudflare/europe-priority-source-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-remaining-18-source-evidence
          path: research/output/europe-remaining-18-source-probe.json
          retention-days: 90
