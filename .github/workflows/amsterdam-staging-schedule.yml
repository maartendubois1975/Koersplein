name: Amsterdam staging daily refresh
on:
  schedule:
    # GitHub scheduled workflows run only from the default branch.
    # 18:40 UTC = 19:40 CET / 20:40 CEST, after the XAMS closing session.
    - cron: '40 18 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: amsterdam-daily-history
  cancel-in-progress: false
jobs:
  refresh-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated Amsterdam staging branch
        uses: actions/checkout@v4
        with:
          ref: amsterdam-reset-20261027
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch official Euronext daily bars with verified fallback
        run: node scripts/history.mjs update --all --batch-size 8
      - name: Validate the complete 80-company history and public market integration
        run: |
          node scripts/cloudflare/test-xams-market-page.mjs
          npm test
          npm run history:test
          node scripts/history/amsterdam-end-to-end-acceptance.mjs
      - name: Check all 80 identities and stored OHLC before staging publication
        run: |
          node scripts/history/audit-amsterdam-import.mjs
          node scripts/history/check-amsterdam-latest-session.mjs
      - name: Persist validated data only to staging
        run: |
          test "$(git branch --show-current)" = "amsterdam-reset-20261027"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/history/*.json
          git add data/amsterdam-import-audit.json
          if git diff --cached --quiet; then
            echo 'No new validated daily prices'
          else
            git commit -m 'data: refresh validated Amsterdam daily history (staging)'
            git push origin HEAD:amsterdam-reset-20261027
          fi
      - name: Fast-forward validated data to isolated Render test branch
        run: |
          git fetch origin codex/koersplein-home-history
          if git merge-base --is-ancestor origin/codex/koersplein-home-history HEAD; then
            git push origin HEAD:codex/koersplein-home-history
          else
            echo 'Test branch diverged; refusing unsafe overwrite' >&2
            exit 1
          fi
