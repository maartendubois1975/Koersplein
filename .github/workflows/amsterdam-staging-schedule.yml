name: European staging daily refresh
on:
  push:
    branches: [main]
    paths: ['.github/workflows/amsterdam-staging-schedule.yml']
  schedule:
    # 19:40 CET / 20:40 CEST, after the exchange's closing session.
    - cron: '40 18 * * 1-5'
  workflow_dispatch:
    inputs:
      session:
        description: 'Completed session YYYY-MM-DD; empty selects the latest completed session'
        required: false
        type: string
permissions:
  contents: read
jobs:
  refresh-staging:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: maartendubois1975/Koersplein/.github/workflows/approved-daily-session.yml@consolidation-20261116
    with:
      session: ${{ inputs.session || '' }}
    secrets:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
