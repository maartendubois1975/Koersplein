name: Paris read-only historical integration plan
on:
  push:
    branches: [paris-reset-20261116]
    paths: [.github/workflows/paris-storage-plan.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/cloudflare/paris-storage-plan.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: paris-storage-plan
          path: research/output/paris-storage-plan.json
