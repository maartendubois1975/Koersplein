name: Approved companies daily session staging
on:
  push:
    branches: [paris-reset-20261116]
    paths: [.github/workflows/approved-daily-session.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mic: [XAMS, XBRU, XPAR]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/cloudflare/approved-daily-session.mjs
        env:
          MARKET_MIC: ${{ matrix.mic }}
      - uses: actions/upload-artifact@v4
        with:
          name: daily-session-${{ matrix.mic }}
          path: research/output/daily-session-*.json
  publish-test-data:
    needs: daily
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/paris-reset-20261116'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paris-reset-20261116
      - uses: actions/download-artifact@v4
        with:
          pattern: daily-session-*
          merge-multiple: true
          path: data
      - run: |
          node scripts/cloudflare/archive-approved-session.mjs
          git config user.name "Koersplein staging"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily-session-XAMS.json data/daily-session-XBRU.json data/daily-session-XPAR.json data/daily-sessions
          if ! git diff --cached --quiet; then git commit -m "Publish verified session snapshots on Paris test branch"; git push origin HEAD:paris-reset-20261116; fi
