name: Approved European companies daily session
on:
  workflow_call:
    inputs:
      session:
        description: 'Completed session YYYY-MM-DD for every approved market'
        type: string
    secrets:
      RENDER_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      session:
        description: 'Completed session YYYY-MM-DD; empty selects the latest closed weekday'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: approved-daily-session-consolidation-20261116
  cancel-in-progress: false
jobs:
  register:
    if: >
      github.repository == 'maartendubois1975/Koersplein' &&
      (github.ref == 'refs/heads/consolidation-20261116' ||
      github.workflow_ref == 'maartendubois1975/Koersplein/.github/workflows/amsterdam-staging-schedule.yml@refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      markets: ${{ steps.register.outputs.markets }}
      reference_session: ${{ steps.register.outputs.reference_session }}
      source_commit: ${{ steps.register.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ job.workflow_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: register
        env:
          REQUESTED_SESSION: ${{ inputs.session }}
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import {approvedCompanyUniverse} from './scripts/history/company-register.mjs';
          import {latestClosedSession} from './scripts/history/trading-calendar.mjs';
          import {execFileSync} from 'node:child_process';
          const now=new Date();
          // Scheduled GitHub runs may start hours late or after local midnight.
          // Always select the latest fully closed approved market session; the
          // archive is idempotent and preserves previously verified records.
          const markets=(await approvedCompanyUniverse())
            .map(m=>({mic:m.mic,session:process.env.REQUESTED_SESSION||latestClosedSession(m.mic,now)}));
          if (!markets.length || markets.some(m => !m.session)) throw Error("NO_APPROVED_MARKET_SESSION");
          console.log('markets='+JSON.stringify(markets));
          console.log('reference_session='+(markets[0]?.session??''));
          console.log('source_commit='+execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim());
          JS
  daily:
    needs: register
    if: needs.register.outputs.markets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.register.outputs.markets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.register.outputs.source_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/cloudflare/approved-daily-session.mjs
        env:
          MARKET_MIC: ${{ matrix.mic }}
          TARGET_SESSION: ${{ matrix.session }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-session-${{ matrix.mic }}
          path: research/output/daily-session-${{ matrix.mic }}.json
          if-no-files-found: warn
  archive-development:
    needs: [register, daily]
    if: always() && needs.register.result == 'success' && needs.register.outputs.markets != '[]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidation-20261116
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: daily-session-*
          merge-multiple: true
          path: research/output
      - run: node scripts/cloudflare/archive-approved-session.mjs
      - name: Preserve successful markets on the development branch
        run: |
          git config user.name "Koersplein development"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily-session-*.json data/daily-sessions
          git add -f data/history
          if ! git diff --cached --quiet; then
            git commit -m "Archive approved European completed sessions"
            git push origin HEAD:consolidation-20261116
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-session-archive-report
          path: research/output/approved-session-archive-report.json
  verify-daily:
    needs: [register, daily, archive-development]
    if: always() && needs.register.result == 'success' && needs.archive-development.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: approved-session-archive-report
      - name: Check and report all intended market sessions after preservation
        env:
          EXPECTED_SESSIONS: ${{ needs.register.outputs.markets }}
          COLLECTION_RESULT: ${{ needs.daily.result }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const expected = JSON.parse(process.env.EXPECTED_SESSIONS);
          const report = JSON.parse(fs.readFileSync('approved-session-archive-report.json', 'utf8'));
          const rows = expected.map(({mic, session}) => {
            const saved = report.markets.find(market => market.market === mic && market.session === session);
            const counts = saved?.counts ?? {};
            return `| ${mic} | ${session} | ${counts.TRADED ?? 0} | ${counts.NO_TRADES ?? 0} | ${counts.MARKET_CLOSED ?? 0} | ${counts.SESSION_UNVERIFIED ?? 0} | ${saved ? 'Archived' : 'Missing or rejected'} |`;
          });
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '| Market | Session | Traded | No trades | Market closed | Unverified | Archive |',
            '| --- | --- | ---: | ---: | ---: | ---: | --- |',
            ...rows, '',
          ].join('\n'));
          const missing = expected.filter(({mic, session}) => !report.markets.some(market => market.market === mic && market.session === session));
          if (process.env.COLLECTION_RESULT !== 'success' || missing.length || report.errors.length) {
            console.error(JSON.stringify({collection:process.env.COLLECTION_RESULT, missing, errors:report.errors}));
            process.exitCode = 1;
          }
          JS
  research-development:
    needs: [register, archive-development]
    if: always() && needs.archive-development.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidation-20261116
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Evaluate frozen predictions and select only provenance-verified histories
        run: node scripts/research/daily-opportunity-ledger.mjs
        env:
          KOERSPLEIN_API_URL: ${{ vars.KOERSPLEIN_API_URL }}
          TARGET_SESSION: ${{ inputs.session || needs.register.outputs.reference_session }}
      - name: Save research results after prices have already been preserved
        run: |
          git config user.name "Koersplein development"
          git config user.email "actions@users.noreply.github.com"
          git add data/opportunity-ledger.json data/opportunity-latest.json data/opportunity-learning.json
          if ! git diff --cached --quiet; then
            git commit -m "Evaluate frozen approved-company research predictions"
            git push origin HEAD:consolidation-20261116
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-opportunity-diagnostics
          path: research/output/daily-opportunity-diagnostics.json
  deploy-test:
    needs: [archive-development, verify-daily, research-development]
    if: always() && needs.verify-daily.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidation-20261116
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate final stored data before any test deployment
        run: |
          npm test
          npm run history:test
      - name: Deploy the exact validated development commit to the existing test service only
        run: |
          export TEST_COMMIT_SHA="$(git rev-parse HEAD)"
          node scripts/cloudflare/deploy-approved-test.mjs
        env:
          TEST_BRANCH: consolidation-20261116
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-deployment-evidence
          path: research/output/test-deployment.json
