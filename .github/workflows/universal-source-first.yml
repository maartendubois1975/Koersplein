name: M00 Europa parallelle beursfabriek
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths: ['.source-first-trigger']
permissions:
  contents: write
  actions: write
concurrency:
  group: koersplein-europe-parallel-factory
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      markets: ${{ steps.pick.outputs.markets }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - id: pick
        name: Kies maximaal vier Europese beurzen
        run: |
          set -euo pipefail
          MARKETS=$(node scripts/cloudflare/select-europe-parallel-markets.mjs)
          echo "markets=$MARKETS" >> "$GITHUB_OUTPUT"
          echo "Geselecteerd: $MARKETS"
  market:
    needs: select
    if: ${{ needs.select.outputs.markets != '[]' && needs.select.outputs.markets != '' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        market_mic: ${{ fromJSON(needs.select.outputs.markets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      group: koersplein-market-${{ matrix.market_mic }}
      cancel-in-progress: false
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
      MARKET_MIC: ${{ matrix.market_mic }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Officiële catalogus
        run: node scripts/cloudflare/universal-source-catalog.mjs
      - name: Gratis bronpreflight
        timeout-minutes: 30
        run: node scripts/cloudflare/universal-source-audit.mjs
      - name: Historische backfill met foutisolatie
        env:
          HISTORY_BATCH_SIZE: 10
          CATALOG_BATCH_SIZE: 25
          ALLOW_PARTIAL_FAILURES: 1
        run: |
          set -euo pipefail
          skip_isins=''; seed=1
          for round in $(seq 1 500); do
            export SKIP_ISINS="$skip_isins"
            if [ "$seed" -eq 1 ]; then SEED_CATALOG=1 node scripts/cloudflare/universal-market-runner.mjs; seed=0; else SEED_CATALOG=0 node scripts/cloudflare/universal-market-runner.mjs; fi
            attempted=$(node -e "const r=require('./research/output/world-fill-batch.json');console.log((r.attemptedIsins||[]).join(','))")
            if [ -n "$attempted" ]; then skip_isins=$(printf '%s,%s' "$skip_isins" "$attempted" | sed 's/^,//'); fi
            remaining=$(node -e "const r=require('./research/output/world-fill-batch.json');console.log(r.remainingHint??999999)")
            candidates=$(node -e "const r=require('./research/output/world-fill-batch.json');console.log(r.candidates??0)")
            if [ "$remaining" -le 0 ] || [ "$candidates" -eq 0 ]; then break; fi
            sleep 2
          done
      - name: Eindvalidatie
        if: ${{ success() }}
        timeout-minutes: 30
        run: node scripts/cloudflare/market-handoff-signal.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-market-${{ matrix.market_mic }}-${{ github.run_number }}
          path: |
            data/market-source-registry.json
            data/euronext-*.json
            research/output/
          retention-days: 30

  persist-completions:
    needs: [select, market]
    if: ${{ always() && needs.select.result == 'success' && needs.select.outputs.markets != '[]' && needs.select.outputs.markets != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          pattern: europe-market-*-${{ github.run_number }}
          path: research/output/completion-artifacts
      - name: Reduceer uitsluitend bewezen marktresultaten
        run: node scripts/cloudflare/reduce-europe-completions.mjs research/output/completion-artifacts
      - name: Bouw canonical health-status
        run: node scripts/cloudflare/build-health-dashboard.mjs
      - name: Bewaar canonical status met één writer
        run: |
          set -euo pipefail
          git config user.name "koersplein-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add data/world-fill-plan.json data/market-source-registry.json data/europe-health.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state: persist proven Europe market evidence"
          git pull --rebase origin main
          git push origin HEAD:main

  continue-autopilot:
    needs: [select, market, persist-completions]
    if: ${{ always() && needs.select.result == 'success' && needs.persist-completions.result == 'success' && needs.select.outputs.markets != '[]' && needs.select.outputs.markets != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Start volgende autonome cyclus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 20
          gh workflow run universal-source-first.yml --repo "${{ github.repository }}" --ref main
