name: M00 Universele source-first marktketen
on:
  workflow_dispatch:
    inputs:
      market_mic:
        description: WAITING markt
        required: true
        default: XDUB
  workflow_run:
    workflows: ['M00 Automatische beurs-handoff']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: koersplein-universal-source-first
  cancel-in-progress: false
jobs:
  source_first:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
      MARKET_MIC: ${{ inputs.market_mic || 'XDUB' }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Selecteer eerstvolgende WAITING markt
        run: |
          if [ -z "$MARKET_MIC" ]; then MARKET_MIC=$(node -e "const p=require('./data/world-fill-plan.json');console.log(p.markets.find(x=>x.state==='WAITING')?.mic||'')"); echo "MARKET_MIC=$MARKET_MIC" >> "$GITHUB_ENV"; fi
          node -e "const p=require('./data/world-fill-plan.json');const m=p.markets.find(x=>x.mic===process.env.MARKET_MIC);if(!m||!['WAITING','ACTIVE'].includes(m.state))throw Error('Geen geldige volgende markt: '+process.env.MARKET_MIC)"
      - name: Officiële catalogus
        run: node scripts/cloudflare/universal-source-catalog.mjs
      - name: Gratis bronpreflight
        run: node scripts/cloudflare/universal-source-audit.mjs
      - name: Bewaar APPROVED gate en catalogus
        run: |
          git config user.name koersplein-factory
          git config user.email actions@users.noreply.github.com
          git add data/market-source-registry.json data/euronext-*.json
          git commit -m "data: approve $MARKET_MIC sources after preflight" || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Historische backfill met foutisolatie
        env:
          HISTORY_BATCH_SIZE: 20
          CATALOG_BATCH_SIZE: 25
          ALLOW_PARTIAL_FAILURES: 1
        run: |
          set -euo pipefail
          skip_isins=''; seed=1
          for round in $(seq 1 100); do
            export SKIP_ISINS="$skip_isins"
            if [ "$seed" -eq 1 ]; then SEED_CATALOG=1 node scripts/cloudflare/universal-market-runner.mjs; seed=0; else SEED_CATALOG=0 node scripts/cloudflare/universal-market-runner.mjs; fi
            new_failed=$(node -e "const r=require('./research/output/world-fill-batch.json');console.log((r.failed||[]).map(x=>x.isin).join(','))")
            if [ -n "$new_failed" ]; then skip_isins=$(printf '%s,%s' "$skip_isins" "$new_failed" | sed 's/^,//'); fi
            remaining=$(node -e "const r=require('./research/output/world-fill-batch.json');console.log(r.remainingHint??999999)")
            candidates=$(node -e "const r=require('./research/output/world-fill-batch.json');console.log(r.candidates??0)")
            if [ "$remaining" -le 0 ] || [ "$candidates" -eq 0 ]; then break; fi
            sleep 3
          done
      - name: Eindvalidatie en automatische handoff
        run: node scripts/cloudflare/market-handoff-signal.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-first-${{ env.MARKET_MIC }}-${{ github.run_number }}
          path: research/output/
          retention-days: 30
