name: M00 Europa parallelle beursfabriek
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  workflow_run:
    workflows: ['M00 Automatische beurs-handoff']
    types: [completed]
  push:
    branches: [main]
    paths: ['.source-first-trigger']
permissions:
  contents: write
concurrency:
  group: koersplein-europe-parallel-factory
  cancel-in-progress: false
jobs:
  select:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      markets: ${{ steps.pick.outputs.markets }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - id: pick
        name: Kies maximaal vier Europese beurzen
        run: |
          MARKETS=$(node scripts/cloudflare/select-europe-parallel-markets.mjs | tail -1)
          echo "markets=$MARKETS" >> "$GITHUB_OUTPUT"
          echo "Geselecteerd: $MARKETS"
  market:
    needs: select
    if: ${{ needs.select.outputs.markets != '[]' && needs.select.outputs.markets != '' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        market_mic: ${{ fromJSON(needs.select.outputs.markets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      group: koersplein-market-${{ matrix.market_mic }}
      cancel-in-progress: false
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
      MARKET_MIC: ${{ matrix.market_mic }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Officiële catalogus
        run: node scripts/cloudflare/universal-source-catalog.mjs
      - name: Gratis bronpreflight
        timeout-minutes: 30
        run: node scripts/cloudflare/universal-source-audit.mjs
      - name: Historische backfill met foutisolatie
        env:
          HISTORY_BATCH_SIZE: 5
          CATALOG_BATCH_SIZE: 5
          ALLOW_PARTIAL_FAILURES: 1
        run: |
          set -euo pipefail
          skip_isins=''; seed=1
          for round in $(seq 1 500); do
            export SKIP_ISINS="$skip_isins"
            if [ "$seed" -eq 1 ]; then SEED_CATALOG=1 node scripts/cloudflare/universal-market-runner.mjs; seed=0; else SEED_CATALOG=0 node scripts/cloudflare/universal-market-runner.mjs; fi
            new_failed=$(node -e "const r=require('./research/output/world-fill-batch.json');console.log((r.failed||[]).map(x=>x.isin).join(','))")
            if [ -n "$new_failed" ]; then skip_isins=$(printf '%s,%s' "$skip_isins" "$new_failed" | sed 's/^,//'); fi
            remaining=$(node -e "const r=require('./research/output/world-fill-batch.json');console.log(r.remainingHint??999999)")
            candidates=$(node -e "const r=require('./research/output/world-fill-batch.json');console.log(r.candidates??0)")
            if [ "$remaining" -le 0 ] || [ "$candidates" -eq 0 ]; then break; fi
            sleep 2
          done
      - name: Eindvalidatie
        if: ${{ success() }}
        timeout-minutes: 30
        run: node scripts/cloudflare/market-handoff-signal.mjs
      - name: Bewaar bewezen COMPLETE-status
        if: ${{ success() }}
        run: |
          set -euo pipefail
          git config user.name "koersplein-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add data/world-fill-plan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state: mark $MARKET_MIC COMPLETE after end validation"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*3))
          done
          echo "Kon COMPLETE-status niet duurzaam opslaan" >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-market-${{ matrix.market_mic }}-${{ github.run_number }}
          path: |
            data/market-source-registry.json
            data/euronext-*.json
            research/output/
          retention-days: 30

  continue-autopilot:
    needs: [select, market]
    if: ${{ needs.select.result == 'success' && needs.market.result == 'success' && needs.select.outputs.markets != '[]' && needs.select.outputs.markets != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Start volgende autonome cyclus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 20
          gh workflow run universal-source-first.yml --repo "${{ github.repository }}" --ref main
