name: Beurs publiceren vanuit chat
on:
  push:
    branches: [main]
    paths: ['data/chat-publication-request.json']
  workflow_dispatch:
    inputs:
      market_mic:
        description: 'Markt-MIC die in chat is onderzocht en nu gepubliceerd moet worden'
        required: false
        type: string
        default: ''
      preflight_only:
        description: 'Alleen catalogus + 100% bronpreflight; geen backfill/publicatie'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: koersplein-europe-${{ inputs.market_mic || github.sha }}
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      markets: ${{ steps.pick.outputs.markets }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: pick
        name: Publiceer alleen de expliciet gekozen chat-beurs
        env:
          FORCE_MARKET_MIC: ${{ inputs.market_mic || '' }}
          CHAT_REQUEST_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$CHAT_REQUEST_EVENT" = "push" ]; then
            FORCE_MARKET_MIC=$(node -p "require('./data/chat-publication-request.json').marketMic")
            export FORCE_MARKET_MIC
          fi
          test -n "$FORCE_MARKET_MIC" || { echo 'Geen expliciete marketMic'; exit 1; }
          MARKETS=$(node scripts/cloudflare/select-europe-parallel-markets.mjs)
          echo "markets=$MARKETS" >> "$GITHUB_OUTPUT"
          echo "Geselecteerd: $MARKETS"
  market:
    needs: select
    if: ${{ needs.select.outputs.markets != '[]' && needs.select.outputs.markets != '' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        market_mic: ${{ fromJSON(needs.select.outputs.markets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      group: koersplein-market-${{ matrix.market_mic }}
      cancel-in-progress: true
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
      MARKET_MIC: ${{ matrix.market_mic }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Officiële catalogus met veilige retry
        run: |
          for attempt in 1 2 3; do
            node scripts/cloudflare/universal-source-catalog.mjs && break
            test "$attempt" -eq 3 && exit 1
            sleep $((attempt * 20))
          done
      - name: Bron-dekkingspoort — bewijs 100% vóór vullen
        timeout-minutes: 30
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            node scripts/cloudflare/universal-source-audit.mjs && break
            test "$attempt" -eq 3 && exit 1
            sleep $((attempt * 30))
          done
          node - <<'NODE'
          const fs=require('fs');
          const plan=JSON.parse(fs.readFileSync('data/world-fill-plan.json','utf8'));
          const m=plan.markets.find(x=>x.mic===process.env.MARKET_MIC);
          if(!m) throw new Error('Onbekende markt '+process.env.MARKET_MIC);
          const r=JSON.parse(fs.readFileSync(`research/output/${m.code}/source-audit.json`,'utf8'));
          const unavailable=Array.isArray(r.dataUnavailable)?r.dataUnavailable:[];
          const unresolved=Array.isArray(r.unresolved)?r.unresolved:r.uncovered||[];
          if(r.catalog<1 || r.combinedCovered+unavailable.length!==r.catalog || unresolved.length!==0 || r.pass!==true){
            throw new Error(`BACKFILL VERBODEN: covered=${r.combinedCovered}, DATA_UNAVAILABLE=${unavailable.length}, unresolved=${unresolved.length}, catalog=${r.catalog}`);
          }
          console.log(`SOURCE COVERAGE GATE PASS: ${r.combinedCovered} covered + ${unavailable.length} proven DATA_UNAVAILABLE = ${r.catalog}/${r.catalog}`);
          NODE
      - name: Worker catalog write/read preflight
        env:
          MARKET_MIC: ${{ matrix.market_mic }}
          KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
          KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { FactoryApiClient } from './scripts/cloudflare/client.mjs';
          const mic='${{ matrix.market_mic }}';
          const plan=JSON.parse(await fs.readFile('data/world-fill-plan.json','utf8'));const code=plan.markets.find(x=>x.mic===mic)?.code;if(!code)throw new Error('WORKER_PREFLIGHT onbekende market code '+mic);
          const raw=JSON.parse(await fs.readFile('data/euronext-'+code+'.json','utf8'));
          const shares=raw.shares||raw.instruments||[];
          if(!shares.length) throw new Error('WORKER_PREFLIGHT lege catalogus '+mic);
          const market={mic,name:raw.exchange||plan.markets.find(x=>x.mic===mic)?.name||mic,code,country:plan.markets.find(x=>x.mic===mic)?.country||null,currency:shares[0]?.currency||'EUR'};
          const client=new FactoryApiClient();
          let preflightShares=shares;
          if(mic==='XICE'){
            try{
              const existing=await client.request('/api/factory/catalog?mic='+encodeURIComponent(mic));
              const rows=existing?.instruments||existing?.shares||[];
              const byTicker=new Map(rows.map(x=>[String(x.ticker||'').toUpperCase(),x]));
              preflightShares=shares.map(x=>{const old=byTicker.get(String(x.ticker||'').toUpperCase());return old?.isin?{...x,isin:old.isin}:x});
              console.log('XICE_PREFLIGHT_IDENTITY_REUSE '+preflightShares.filter((x,i)=>x.isin!==shares[i].isin).length+'/'+shares.length);
            }catch(e){console.log('XICE_PREFLIGHT_IDENTITY_REUSE unavailable: '+e.message)}
          }
          await client.seedCatalog({markets:[market],instruments:[]});
          for(let i=0;i<preflightShares.length;i+=100) await client.seedCatalog({markets:[],instruments:preflightShares.slice(i,i+100)});
          const probes=[preflightShares[0],preflightShares[Math.floor(preflightShares.length/2)],preflightShares.at(-1)].filter(Boolean);
          const failed=[];
          for(const item of probes){try{await client.historyCoverage(item.isin)}catch(e){if(!/Historie niet gevonden/.test(e.message)) failed.push(item.isin+': '+e.message)}}
          if(failed.length) throw new Error('WORKER_VERSION_OR_CATALOG_GATE '+failed.join(' | '));
          console.log('WORKER CATALOG PREFLIGHT PASS '+mic+' probes='+probes.map(x=>x.isin).join(','));
          NODE

      - name: Historische backfill met foutisolatie
        if: ${{ inputs.preflight_only != true }}
        timeout-minutes: 90
        env:
          HISTORY_BATCH_SIZE: 100
          CATALOG_BATCH_SIZE: 25
          ALLOW_PARTIAL_FAILURES: 1
        run: |
          set -euo pipefail
          skip_isins=''; seed=1
          for round in $(seq 1 100); do
            export SKIP_ISINS="$skip_isins"
            if [ "$seed" -eq 1 ]; then SEED_CATALOG=1 node scripts/cloudflare/universal-market-runner.mjs; seed=0; else SEED_CATALOG=0 node scripts/cloudflare/universal-market-runner.mjs; fi
            attempted=$(node -e "const r=require('./research/output/world-fill-batch.json');console.log((r.attemptedIsins||[]).join(','))")
            if [ -n "$attempted" ]; then skip_isins=$(printf '%s,%s' "$skip_isins" "$attempted" | sed 's/^,//'); fi
            remaining=$(node -e "const r=require('./research/output/world-fill-batch.json');console.log(r.remainingHint??999999)")
            candidates=$(node -e "const r=require('./research/output/world-fill-batch.json');console.log(r.candidates??0)")
            if [ "$remaining" -le 0 ] || [ "$candidates" -eq 0 ]; then break; fi
            sleep 2
          done
      - name: Herstel resterende eindvalidatie-uitzonderingen
        if: ${{ inputs.preflight_only != true }}
        run: |
          set -euo pipefail
          for repair in 1 2 3; do
            if node scripts/cloudflare/market-handoff-signal.mjs; then :; fi
            ready=$(node -e "const s=require('./research/output/market-handoff-signal.json');console.log(s.current.ready?'yes':'no')")
            [ "$ready" = yes ] && break
            export SKIP_ISINS=''
            SEED_CATALOG=0 node scripts/cloudflare/universal-market-runner.mjs
            sleep $((repair * 5))
          done
      - name: Eindvalidatie
        if: ${{ success() && inputs.preflight_only != true }}
        timeout-minutes: 30
        run: |
          for attempt in 1 2 3; do
            node scripts/cloudflare/market-handoff-signal.mjs && break
            test "$attempt" -eq 3 && exit 1
            sleep $((attempt * 30))
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-market-${{ matrix.market_mic }}-${{ github.run_number }}
          path: |
            data/market-source-registry.json
            data/euronext-*.json
            research/output/
          retention-days: 30

  persist-completions:
    outputs:
      changed: ${{ steps.persist.outputs.changed }}
    needs: [select, market]
    if: ${{ always() && needs.select.result == 'success' && needs.select.outputs.markets != '[]' && needs.select.outputs.markets != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          pattern: europe-market-*-${{ github.run_number }}
          path: research/output/completion-artifacts
      - name: Reduceer uitsluitend bewezen marktresultaten
        run: node scripts/cloudflare/reduce-europe-completions.mjs research/output/completion-artifacts
      - name: Bouw canonical health-status
        run: node scripts/cloudflare/build-health-dashboard.mjs
      - id: persist
        name: Bewaar canonical status met één writer
        run: |
          set -euo pipefail
          git config user.name "koersplein-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add data/world-fill-plan.json data/market-source-registry.json data/europe-health.json data/markets.json data/euronext-*.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "state: persist proven Europe market evidence"
          git pull --rebase origin main
          git push origin HEAD:main
