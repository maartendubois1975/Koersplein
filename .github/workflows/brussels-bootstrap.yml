name: Brussel eenmalig vullen
on:
  push:
    branches: [brussels-full-market]
    paths: [.github/workflows/brussels-bootstrap.yml]
permissions:
  contents: write
concurrency:
  group: koersplein-brussels-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brussels-full-market
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Haal officiële Brusselse aandelenlijst op
        run: node scripts/cloudflare/fetch-brussels-catalog.mjs
      - name: Bewaar Brusselse catalogus op de branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/euronext-brussels.json
          git commit -m "Voeg officiële Brusselse aandelencatalogus toe" || true
          git push origin HEAD:brussels-full-market
      - name: Vul Brussel via dezelfde koersfabriek
        run: node scripts/cloudflare/brussels-backfill.mjs
