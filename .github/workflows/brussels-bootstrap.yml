name: Brussel eenmalig vullen
on:
  push:
    branches: [brussels-full-market]
    paths:
      - .github/workflows/brussels-bootstrap.yml
      - scripts/history/providers/yahoo-chart.mjs
      - scripts/cloudflare/brussels-backfill.mjs
      - scripts/cloudflare/repair-brussels-quality.mjs
      - scripts/cloudflare/validate-brussels.mjs
      - scripts/cloudflare/catalog.mjs
permissions:
  contents: read
concurrency:
  group: koersplein-brussels-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vul Brussel via de generieke koersfabriek
        run: node scripts/cloudflare/brussels-backfill.mjs
      - name: Herstel aantoonbaar inconsistente optionele OHLC-velden
        run: node scripts/cloudflare/repair-brussels-quality.mjs --isins=BE0003770840,BE0974496284,BE0003735496,BE0003730448,IL0010830391,BE0003741551,BE0003656676,BE0003898187,BE0974464977,BE0003470755,BE0003545531,BE0974263924,BE0003878957,BE0003754687,BE0974271034,BE0974349814,BE0003734481,BE0003724383
      - name: Valideer alle Brusselse koersreeksen
        run: node scripts/cloudflare/validate-brussels.mjs
