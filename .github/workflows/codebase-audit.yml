name: Koersplein A-tot-Z audit
on:
  push:
    branches: [main, 'cleanup/**']
    paths:
      - '.github/workflows/codebase-audit.yml'
      - 'scripts/audit/**'
      - 'scripts/archive/**'
      - 'data/atlas-archive/**'
      - 'scripts/validate.mjs'
      - 'package.json'
      - 'data/markets.json'
      - 'data/world-fill-plan.json'
      - 'data/euronext-*.json'
      - 'index.html'
      - 'app.js'
      - 'market.js'
      - 'share.html'
      - 'share.js'
      - '*.html'
      - 'scripts/cloudflare/**'
      - 'scripts/research/**'
      - 'data/machine-pipeline.json'
      - '.github/workflows/paris-*.yml'
      - '.github/workflows/world-fill-controller.yml'
      - '.github/workflows/market-handoff-controller.yml'
      - '.github/workflows/universal-source-first.yml'
      - '.github/workflows/complete-market-analysis.yml'
      - '.github/workflows/daily-opportunity-ledger.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: koersplein-codebase-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run main validation and regression tests
        run: npm test
      - name: Test historical +30 percent chain scanner
        run: node scripts/research/test-plus30-chain-scanner.mjs
      - name: Controleer JavaScript JSON workflows en architectuur
        run: node scripts/audit/codebase-audit.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koersplein-codebase-audit
          path: research/output/audit/codebase-audit.json
          retention-days: 90
