name: Koersplein A-tot-Z audit
on:
  push:
    branches: [main, 'cleanup/**']
    paths:
      - '.github/workflows/codebase-audit.yml'
      - 'scripts/audit/**'
      - 'scripts/validate.mjs'
      - 'package.json'
      - 'data/markets.json'
      - 'data/world-fill-plan.json'
      - 'data/euronext-*.json'
      - 'index.html'
      - 'app.js'
      - 'market.js'
      - 'share.html'
      - 'share.js'
      - '*.html'
      - 'scripts/cloudflare/**'
      - 'scripts/research/**'
      - 'data/machine-pipeline.json'
      - '.github/workflows/universal-source-first.yml'
      - '.github/workflows/complete-market-analysis.yml'
      - '.github/workflows/daily-opportunity-ledger.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: koersplein-codebase-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run main validation and regression tests
        run: npm test
      - name: Test free Euronext historical OHLC number formats
        run: node scripts/cloudflare/test-euronext-number-format.mjs
      - name: Test historical +30 percent chain scanner
        run: node scripts/research/test-plus30-chain-scanner.mjs
      - name: Controleer JavaScript JSON workflows en architectuur
        run: node scripts/audit/codebase-audit.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koersplein-codebase-audit
          path: |
            research/output/audit/codebase-audit.json
            research/output/audit/dependency-inventory.json
          retention-days: 90
