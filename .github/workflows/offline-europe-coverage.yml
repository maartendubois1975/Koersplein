name: Koersplein Europese broncontrole zonder Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/offline-europe-coverage.yml'
      - 'scripts/cloudflare/catalog.mjs'
      - 'data/markets.json'
      - 'data/history-instruments.json'
      - 'data/euronext-*.json'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controleer broncatalogus zonder API-token
        run: |
          mkdir -p research/output/audit
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { cloudflareCatalog } from './scripts/cloudflare/catalog.mjs';
          const catalog = await cloudflareCatalog();
          const counts = new Map(catalog.markets.map(m => [m.mic, { mic:m.mic, name:m.name, instruments:0, missingIsin:0 }]));
          for (const item of catalog.instruments) counts.get(item.mic).instruments++;
          for (const item of catalog.unresolved) counts.get(item.mic).missingIsin++;
          const report = {
            evidence:'GITHUB_SOURCE_ONLY_NOT_LIVE_CLOUDFLARE',
            generatedAt:new Date().toISOString(),
            totals:{markets:catalog.markets.length, uniqueInstruments:catalog.instruments.length, unresolvedIsin:catalog.unresolved.length},
            markets:[...counts.values()],
            unresolved:catalog.unresolved
          };
          fs.writeFileSync('research/output/audit/offline-europe-coverage.json', JSON.stringify(report,null,2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Europese broncontrole (geen live Cloudflare-audit)\n\n' +
            '| Beurzen | Unieke instrumenten | Ontbrekende ISIN |\n|---:|---:|---:|\n' +
            '| '+report.totals.markets+' | '+report.totals.uniqueInstruments+' | '+report.totals.unresolvedIsin+' |\n\n' +
            'Dit bewijst geen live koershistorie of Cloudflare-registratie.\n');
          console.log(JSON.stringify(report.totals));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-europe-coverage
          path: research/output/audit/offline-europe-coverage.json
          if-no-files-found: warn
          retention-days: 30
