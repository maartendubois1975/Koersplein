name: Europe 102 missing source research
on:
  push:
    branches: [main]
    paths: ['scripts/cloudflare/europe-priority-source-probe.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/cloudflare/europe-priority-source-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-priority-102-source-evidence
          path: research/output/europe-priority-102-source-probe.json
          retention-days: 90
