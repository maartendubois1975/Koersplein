name: European bulk engine offline tests
on:
  push:
    branches: [main]
    paths:
      - 'scripts/cloudflare/exchange-bulk-reconcile.mjs'
      - 'scripts/cloudflare/exchange-bulk-reconcile.test.mjs'
      - '.github/workflows/europe-bulk-engine-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exchange-wide bars and ISIN mapping
        run: node scripts/cloudflare/exchange-bulk-reconcile.test.mjs
