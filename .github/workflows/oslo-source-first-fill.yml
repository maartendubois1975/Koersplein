name: LEGACY Oslo Fill (manual only)
on:
  workflow_dispatch:
concurrency:
  group: oslo-source-first-production
  cancel-in-progress: true
jobs:
  oslo:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fetch official Oslo catalogue
        run: node scripts/cloudflare/fetch-oslo-catalog.mjs
      - name: Full source audit before any backfill
        run: node scripts/cloudflare/oslo-source-audit.mjs
      - name: Persist approved source gate and official catalogue
        run: |
          git config user.name 'koersplein-factory'
          git config user.email 'actions@users.noreply.github.com'
          git add data/market-source-registry.json data/euronext-oslo.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: approve Oslo sources after full preflight'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Validate repository
        run: npm run validate
      - name: Full Oslo historical backfill
        env:
          KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
          KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
          MARKET_MIC: XOSL
          HISTORY_BATCH_SIZE: 20
          CATALOG_BATCH_SIZE: 25
          ALLOW_PARTIAL_FAILURES: 1
        run: |
          set -euo pipefail
          : > research/output/oslo/rounds.jsonl
          skip_isins=''
          seed=1
          for round in $(seq 1 80); do
            export SKIP_ISINS="$skip_isins"
            if [ "$seed" -eq 1 ]; then SEED_CATALOG=1 node scripts/cloudflare/universal-market-runner.mjs; seed=0; else SEED_CATALOG=0 node scripts/cloudflare/universal-market-runner.mjs; fi
            node -e "const fs=require('fs');const r=require('./research/output/world-fill-batch.json');fs.appendFileSync('./research/output/oslo/rounds.jsonl',JSON.stringify({round:$round,...r})+'\n')"
            new_failed=$(node -e "const r=require('./research/output/world-fill-batch.json');console.log((r.failed||[]).map(x=>x.isin).join(','))")
            if [ -n "$new_failed" ]; then skip_isins=$(printf '%s,%s' "$skip_isins" "$new_failed" | sed 's/^,//'); fi
            remaining=$(node -e "const r=require('./research/output/world-fill-batch.json');console.log(r.remainingHint ?? 999999)")
            candidates=$(node -e "const r=require('./research/output/world-fill-batch.json');console.log(r.candidates ?? 0)")
            if [ "$remaining" -le 0 ] || [ "$candidates" -eq 0 ]; then break; fi
            sleep 3
          done
      - name: Oslo end validation
        if: always()
        env:
          KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
          KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
          MARKET_MIC: XOSL
        run: |
          node scripts/cloudflare/market-handoff-signal.mjs
          cp research/output/market-handoff-signal.json research/output/oslo/end-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oslo-source-first-results
          path: |
            data/euronext-oslo.json
            data/market-source-registry.json
            research/output/oslo/source-audit.json
            research/output/oslo/rounds.jsonl
            research/output/oslo/end-validation.json
            research/output/world-fill-batch.json
          retention-days: 30
