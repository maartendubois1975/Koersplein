name: M00 Automatische beurs-handoff
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - M00 Wereldvuller
      - Oslo Source-First Fill
      - M00 Universele source-first marktketen
    types: [completed]
permissions:
  contents: read
concurrency:
  group: koersplein-market-handoff
  cancel-in-progress: true
jobs:
  handoff:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KOERSPLEIN_API_URL: ${{ secrets.KOERSPLEIN_API_URL }}
      KOERSPLEIN_FACTORY_TOKEN: ${{ secrets.KOERSPLEIN_FACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Controleer verborgen COMPLETE-signaal en bepaal opvolger
        id: gate
        run: |
          node scripts/cloudflare/market-handoff-signal.mjs | tee handoff.log
          NEXT=$(grep '^KOERSPLEIN_HANDOFF=' handoff.log | tail -1 | cut -d= -f2 || true)
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
      - name: Zet volgende beurs in source-first fase
        if: ${{ steps.gate.outputs.next != '' }}
        env:
          NEXT_MIC: ${{ steps.gate.outputs.next }}
        run: |
          echo "Volgende markt automatisch geactiveerd voor brononderzoek: $NEXT_MIC"
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('data/market-source-registry.json'));const m=r.markets?.[process.env.NEXT_MIC];if(m?.status==='APPROVED')process.exit(0);console.log('SOURCE_RESEARCH_REQUIRED='+process.env.NEXT_MIC)"
      - name: Start backfill alleen wanneer brononderzoek al APPROVED is
        if: ${{ steps.gate.outputs.next != '' }}
        env:
          NEXT_MIC: ${{ steps.gate.outputs.next }}
        run: |
          STATUS=$(node -e "const r=require('./data/market-source-registry.json');console.log(r.markets?.[process.env.NEXT_MIC]?.status||'MISSING')")
          if [ "$STATUS" = "APPROVED" ]; then MARKET_MIC="$NEXT_MIC" HISTORY_OFFSET=0 node scripts/cloudflare/universal-market-runner.mjs; else echo "Backfill geblokkeerd tot source-first APPROVED: $NEXT_MIC"; fi
      - name: Bewaar verborgen overdrachtsbewijs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-handoff-${{ github.run_number }}
          path: |
            research/output/market-handoff-signal.json
            research/output/world-fill-state.json
          retention-days: 30
