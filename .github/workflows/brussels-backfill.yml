name: Brussels historical recovery
on:
  push:
    branches: [brussels-reset-20261114]
    paths: [.github/workflows/brussels-backfill.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: brussels-backfill
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brussels-reset-20261114
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run history:test
      - uses: actions/download-artifact@v4
        with:
          name: brussels-existing-history-audit
          run-id: '43682166286'
          github-token: ${{ github.token }}
          path: /tmp/brussels-audit
      - name: Recover audited history and refresh official sessions
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs/promises';
          import {loadCatalog,validateBars,syncInstrument} from './scripts/history/engine.mjs';
          const a=await loadCatalog(), b=await loadCatalog('XBRU');
          if(a.length!==80||b.length!==105||b.some(x=>a.some(y=>y.isin===x.isin)))throw Error('Catalog guard');
          const audit=JSON.parse(await fs.readFile('/tmp/brussels-audit/brussels-existing-history.json','utf8'));
          if(audit.length!==105)throw Error('Incomplete audit');
          const results=[],paths=[];
          const base='https://koersplein.maarten-dubois1975.workers.dev';
          const {EuronextLiveProvider}=await import('./scripts/history/providers/euronext-live.mjs');
          const official=new EuronextLiveProvider();
          const get=async path=>{const r=await fetch(base+path,{signal:AbortSignal.timeout(45000)});if(!r.ok)throw Error('HTTP '+r.status);return r.json()};
          const today=new Date().toISOString().slice(0,10);
          await fs.mkdir('/tmp/brussels-quarantine',{recursive:true});
          await fs.mkdir('data/history',{recursive:true});
          for(const i of b){
            const row=audit.find(x=>x.isin===i.isin);
            const p='data/history/'+i.isin+'.json';
            const result={isin:i.isin,symbol:i.symbol,mic:i.mic};
            try{
              // Existing verified files and absent legacy histories use the same
              // engine; never make recovery of one company depend on another.
              let staged=null;
              try{staged=JSON.parse(await fs.readFile(p,'utf8'))}catch(e){if(e.code!=='ENOENT')throw e}
              if(staged||!row?.records){
                if(staged&&(staged.instrument?.isin!==i.isin||staged.instrument?.mic!==i.mic||validateBars(staged.bars).length!==staged.bars.length))throw Error('Existing staged history requires quarantine');
                const mode=staged?'update':'backfill';
                let failure;
                for(let attempt=0;attempt<3;attempt++){
                  try{result.refresh=await syncInstrument(i,{mode});failure=null;break}catch(e){failure=e;await new Promise(r=>setTimeout(r,1000*(attempt+1)))}
                }
                if(failure)throw failure;
                const after=JSON.parse(await fs.readFile(p,'utf8'));
                const dates=new Set(after.bars.map(x=>x.date));
                if(after.instrument.isin!==i.isin||after.instrument.mic!==i.mic||!after.bars.length||validateBars(after.bars).length!==after.bars.length||staged?.bars.some(x=>!dates.has(x.date)))throw Error('Persistence guard');
                result.records=after.bars.length;result.last=after.bars.at(-1).date;
                paths.push(p);
                results.push(result);console.log('BRUSSELS_RECOVERY '+JSON.stringify(result));
                await fs.writeFile('/tmp/brussels-recovery-result.json',JSON.stringify(results,null,2));
                await fs.writeFile('/tmp/brussels-paths',paths.join('\n')+'\n');
                continue;
              }
              let h;
              if(row.identityMatch&&!row.rejected)h=JSON.parse(await fs.readFile('/tmp/brussels-audit/brussels-recovery/'+i.isin+'.json','utf8'));
              else {
                const key=row.matches.find(x=>x.key===i.mic+':'+i.isin)?.key||row.matches.find(x=>x.key==='XBRU:'+i.isin)?.key;
                if(!key)throw Error('No exact or legacy Brussels source key');
                h=await get('/api/history/'+key);
                await fs.writeFile('/tmp/brussels-quarantine/'+i.isin+'.json',JSON.stringify(h));
                if(!row.identityMatch){
                  // Do not relabel legacy venue data. Request a separate official
                  // history for the approved segment, leaving the legacy snapshot intact.
                  result.refresh=await syncInstrument(i,{mode:'backfill'});
                  const fresh=JSON.parse(await fs.readFile(p,'utf8'));
                  if(fresh.instrument.isin!==i.isin||fresh.instrument.mic!==i.mic||!fresh.bars.length||validateBars(fresh.bars).length!==fresh.bars.length)throw Error('Official segment history validation failed');
                  result.records=fresh.bars.length;result.last=fresh.bars.at(-1).date;
                  paths.push(p);
                  results.push(result);console.log('BRUSSELS_RECOVERY '+JSON.stringify(result));
                  await fs.writeFile('/tmp/brussels-recovery-result.json',JSON.stringify(results,null,2));
                  await fs.writeFile('/tmp/brussels-paths',paths.join('\n')+'\n');
                  continue;
                }
              }
              let bars=validateBars(h.bars||[]);
              if(row.rejected){
                const groups=new Map();for(const x of h.bars){const date=x?.date||'INVALID_DATE';if(!groups.has(date))groups.set(date,[]);groups.get(date).push(x)}
                const bad=[...groups].filter(([date,x])=>x.length!==1||validateBars(x).length!==1);
                const corrections=[];let unresolved=[];
                for(const [date,raw] of bad){
                  try{if(!/^\d{4}-\d{2}-\d{2}$/.test(date))throw Error('Invalid date');const f=await official.fetchDaily(i,{startDate:date,endDate:date,signal:AbortSignal.timeout(25000)});if(f.providerMeta.partialHistory||f.providerMeta.isin!==i.isin||f.providerMeta.mic!==i.mic)throw Error('Unverified response');const b=validateBars(f.bars).find(x=>x.date===date);if(!b)throw Error('No verified traded bar');corrections.push(b)}catch(e){unresolved.push({date,error:e.message})}
                }
                result.exceptions={bad:bad.map(x=>x[0]),corrected:corrections.map(x=>x.date),unresolved};
                if(unresolved.length)throw Error('Historical exceptions unresolved; originals preserved');
                const badDates=new Set(bad.map(x=>x[0]));bars=validateBars([...bars.filter(x=>!badDates.has(x.date)),...corrections]);
              }
              if(h.instrument?.isin!==i.mic+':'+i.isin&&h.instrument?.isin!==i.isin)throw Error('ISIN mismatch');
              if(h.instrument?.mic!==i.mic||h.instrument?.currency!=='EUR'||h.instrument?.symbol!==i.symbol||(!row.rejected&&(bars.length!==row.records||bars.length!==h.bars.length)))throw Error('Snapshot mismatch');
              if(bars.some(x=>x.date>new Date().toISOString().slice(0,10)))throw Error('Future record');
              let existing;
              try{existing=JSON.parse(await fs.readFile(p,'utf8'))}catch(e){if(e.code!=='ENOENT')throw e}
              if(!existing){
                const volumeRecords=bars.filter(x=>Number.isFinite(x.volume)).length;
                await fs.writeFile(p,JSON.stringify({schemaVersion:1,instrument:{isin:i.isin,name:i.name,symbol:i.symbol,mic:i.mic,market:i.market,currency:'EUR',identitySource:i.identitySource},provider:{id:'legacy-cloudflare',name:'Recovered historical source',metadata:{originalProvider:h.provider,sourceKey:h.instrument.isin,corrections:result.exceptions||null,adjustmentStatus:'UNVERIFIED',completenessEvidenceVerified:false}},coverage:{firstDate:bars[0].date,lastDate:bars.at(-1).date,records:bars.length,volumeRecords,missingVolumeRecords:bars.length-volumeRecords,backfillComplete:false},bars},null,2)+'\n');
              }
              const before=JSON.parse(await fs.readFile(p,'utf8'));
              for(let attempt=0;attempt<3;attempt++){
                try{result.refresh=await syncInstrument(i,{mode:'update'});delete result.refreshError;break}catch(e){result.refreshError=e.message;await new Promise(r=>setTimeout(r,1000*(attempt+1)))}
              }
              const after=JSON.parse(await fs.readFile(p,'utf8'));
              const dates=new Set(after.bars.map(x=>x.date));
              if(after.instrument.isin!==i.isin||after.instrument.mic!==i.mic||validateBars(after.bars).length!==after.bars.length||before.bars.some(x=>!dates.has(x.date)))throw Error('Persistence guard');
              result.records=after.bars.length;result.last=after.bars.at(-1).date;
              paths.push(p);
            }catch(e){result.error=e.message}
            results.push(result);console.log('BRUSSELS_RECOVERY '+JSON.stringify(result));
            await fs.writeFile('/tmp/brussels-recovery-result.json',JSON.stringify(results,null,2));
            await fs.writeFile('/tmp/brussels-paths',paths.join('\n')+'\n');
            await new Promise(r=>setTimeout(r,500));
          }
          console.log('RECOVERY_SUMMARY '+JSON.stringify({total:results.length,saved:paths.length,refreshErrors:results.filter(x=>x.refreshError).length,pending:results.filter(x=>x.error).length}));
          EOF
      - name: Persist verified recovery to isolated branch
        run: |
          test "$(git branch --show-current)" = brussels-reset-20261114
          test -s /tmp/brussels-paths
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f --pathspec-from-file=/tmp/brussels-paths
          if ! git diff --cached --quiet; then
            git commit -m 'data: recover structurally verified Brussels history (staging only)'
            git push origin HEAD:brussels-reset-20261114
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brussels-recovery-results
          path: |
            /tmp/brussels-recovery-result.json
            /tmp/brussels-paths
            /tmp/brussels-quarantine/
          retention-days: 30
