name: Europees herstel binnen dezelfde run
on:
  workflow_run:
    workflows: [Dagelijkse Open Close Update]
    types: [completed]
permissions:
  contents: read
  actions: write
concurrency:
  group: koersplein-europe-run-recovery
  cancel-in-progress: false
jobs:
  repair-europe-groups:
    if: ${{ github.event.workflow_run.id == 39032970988 && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 2 && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Herstel alle groepen binnen dezelfde goedgekeurde Europese run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cloudflare/recover-europe-run.mjs
