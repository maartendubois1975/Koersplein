name: Amsterdam history smoke
on:
  pull_request:
    paths:
      - '.github/workflows/amsterdam-history-smoke.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/history.mjs update --all --batch-size 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amsterdam-history-evidence
          path: data/history/*.json
