          node --check scripts/cloudflare/test-europe-ohlc-defects.mjs
          node --check scripts/cloudflare/europe-stored-ohlc-severity.mjs
          node --check scripts/cloudflare/test-europe-stored-ohlc-severity.mjs
          node --check scripts/cloudflare/europe-ohlc-source-evidence.mjs
          node --check scripts/cloudflare/europe-incomplete-ohlc-source-probe.mjs
          node --check scripts/cloudflare/test-europe-ohlc-source-evidence.mjs
          node --check scripts/cloudflare/openfigi-reference-evidence.mjs
          node --check scripts/cloudflare/openfigi-reference-probe.mjs
          node --check scripts/cloudflare/openfigi-yahoo-evidence.mjs
          node --check scripts/cloudflare/europe-missing-backfill-priority.mjs
          node --check scripts/cloudflare/six-sponsored-reference.mjs
          node --check scripts/cloudflare/six-sponsored-identity-probe.mjs
          node --check scripts/cloudflare/test-six-sponsored-reference.mjs
          node --check scripts/cloudflare/test-europe-missing-backfill-priority.mjs
          node --check scripts/cloudflare/openfigi-yahoo-verification-probe.mjs
          node --check scripts/cloudflare/test-openfigi-yahoo-evidence.mjs
          node --check scripts/cloudflare/test-openfigi-reference-evidence.mjs
          node --check scripts/cloudflare/reconcile-official-daily.mjs
          node --check scripts/cloudflare/paris-history-eligibility.mjs
          node --check scripts/cloudflare/paris-targeted-history-recovery.mjs
          node --check scripts/cloudflare/test-paris-history-eligibility.mjs
          node --check scripts/cloudflare/europe-failure-diagnosis.mjs
          node --check scripts/cloudflare/test-europe-failure-diagnosis.mjs
          node --check scripts/cloudflare/summarize-europe-run.mjs
          node --check scripts/cloudflare/test-europe-summary-integration.mjs
          node --check scripts/cloudflare/six-ipo-symbol-evidence.mjs
          node --check scripts/cloudflare/six-ipo-symbol-probe.mjs
          node --check scripts/cloudflare/test-six-ipo-symbol-evidence.mjs
          node --check scripts/history/providers/yahoo-chart.mjs
          node --check scripts/history/providers/yahoo-isin.mjs
          node --check scripts/history/providers/nasdaq-baltic.mjs
          node --check scripts/cloudflare/test-nasdaq-baltic-provider.mjs
          node --check scripts/cloudflare/test-bse-sofia.mjs
          node --check scripts/cloudflare/europe-recovery-queue.mjs
          node --check scripts/cloudflare/test-europe-recovery-queue.mjs
          node --check scripts/cloudflare/europe-shard-coverage.mjs
          node --check scripts/cloudflare/format-europe-run-report.mjs
          node --check scripts/cloudflare/test-europe-reporting.mjs
          node --check scripts/cloudflare/test-swiss-yahoo-identity.mjs
          node --check scripts/cloudflare/test-london-yahoo-currency.mjs
      - name: Test approved provider routing
        run: |
          node scripts/cloudflare/test-europe-provider-routing.mjs
          node scripts/cloudflare/test-mse-official-no-trade.mjs
          node scripts/cloudflare/test-mse-archive-evidence.mjs
          node scripts/cloudflare/test-europe-workflow-revision.mjs
          node scripts/cloudflare/test-europe-ohlc-integrity.mjs
          node scripts/cloudflare/test-public-history-manifest.mjs
          node scripts/cloudflare/test-europe-run-policy.mjs
          node scripts/cloudflare/test-europe-summary.mjs
          node scripts/cloudflare/test-europe-session-deltas.mjs
          node scripts/cloudflare/test-europe-summary-integration.mjs
          node scripts/cloudflare/test-europe-ohlc-defects.mjs
          node scripts/cloudflare/test-europe-stored-ohlc-severity.mjs
          node scripts/cloudflare/test-europe-ohlc-source-evidence.mjs
          node scripts/cloudflare/test-openfigi-reference-evidence.mjs
          node scripts/cloudflare/test-openfigi-yahoo-evidence.mjs
          node scripts/cloudflare/test-europe-missing-backfill-priority.mjs
          node scripts/cloudflare/test-six-sponsored-reference.mjs
          node scripts/cloudflare/test-paris-history-eligibility.mjs
          node scripts/cloudflare/test-europe-failure-diagnosis.mjs
          node scripts/cloudflare/test-six-ipo-symbol-evidence.mjs
          node scripts/cloudflare/test-nasdaq-baltic-provider.mjs
          node scripts/cloudflare/test-bse-sofia.mjs
          node scripts/cloudflare/test-official-daily-status.mjs
          node scripts/cloudflare/test-europe-recovery-queue.mjs
          node scripts/cloudflare/test-europe-reporting.mjs
          node scripts/cloudflare/test-swiss-yahoo-identity.mjs
          node scripts/cloudflare/test-london-yahoo-currency.mjs
      - name: Probe MSE official 2026 archive for exact October 22 PDF (read-only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[mse-archive-probe]')
        continue-on-error: true
        timeout-minutes: 3
        env:
          MSE_ARCHIVE_TARGET_DATE: '2026-10-22'
        run: |
          command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          node scripts/cloudflare/mse-archive-probe.mjs
      - name: Probe Prague official free archive for seven exact ISINs (read-only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[pse-official-probe]')
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/cloudflare/pse-official-archive-probe.mjs
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[pse-official-probe]')
        with:
          name: pse-official-archive-evidence
          path: research/output/pse-official-archive-probe.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[mse-archive-probe]')
        with:
          name: mse-official-archive-evidence
          path: research/output/mse-archive-evidence.json
          retention-days: 30
