  workflow_dispatch:
jobs:
  provider-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production script syntax
        run: |
          node --check scripts/history/provider-registry.mjs
          node --check scripts/history/providers/mse-official-price-list.mjs
          node --check scripts/history/official-daily-status.mjs
          node --check scripts/cloudflare/test-official-daily-status.mjs
          node --check scripts/cloudflare/test-mse-official-no-trade.mjs
          node --check scripts/cloudflare/mse-archive-evidence.mjs
          node --check scripts/cloudflare/mse-archive-probe.mjs
          node --check scripts/cloudflare/test-mse-archive-evidence.mjs
          node --check scripts/cloudflare/test-europe-workflow-revision.mjs
          node --check scripts/cloudflare/daily-open-close-update.mjs
          node --check scripts/cloudflare/test-europe-provider-routing.mjs
          node --check scripts/cloudflare/audit-daily-open-close.mjs
          node --check scripts/cloudflare/public-history-manifest.mjs
          node --check scripts/cloudflare/test-public-history-manifest.mjs
          node --check scripts/cloudflare/europe-run-policy.mjs
          node --check scripts/cloudflare/test-europe-ohlc-integrity.mjs
