name: Europe routing regression
on:
  push:
    paths:
      - 'scripts/history/provider-registry.mjs'
      - 'scripts/cloudflare/daily-open-close-update.mjs'
      - 'scripts/cloudflare/test-europe-provider-routing.mjs'
      - '.github/workflows/europe-routing-regression.yml'
  workflow_dispatch:
jobs:
  provider-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production script syntax
        run: |
          node --check scripts/history/provider-registry.mjs
          node --check scripts/cloudflare/daily-open-close-update.mjs
          node --check scripts/cloudflare/test-europe-provider-routing.mjs
      - name: Test approved provider routing
        run: node scripts/cloudflare/test-europe-provider-routing.mjs
