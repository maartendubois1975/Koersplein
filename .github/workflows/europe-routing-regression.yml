name: Europe routing regression
on:
  push:
    paths:
      - 'scripts/history/provider-registry.mjs'
      - 'scripts/cloudflare/daily-open-close-update.mjs'
      - 'scripts/cloudflare/audit-daily-open-close.mjs'
      - 'scripts/cloudflare/reconcile-official-daily.mjs'
      - 'scripts/cloudflare/paris-history-eligibility.mjs'
      - 'scripts/cloudflare/test-paris-history-eligibility.mjs'
      - 'scripts/cloudflare/europe-failure-diagnosis.mjs'
      - 'scripts/cloudflare/test-europe-failure-diagnosis.mjs'
      - 'scripts/cloudflare/summarize-europe-run.mjs'
      - 'scripts/cloudflare/six-ipo-symbol-evidence.mjs'
      - 'scripts/cloudflare/six-ipo-symbol-probe.mjs'
      - 'scripts/cloudflare/test-six-ipo-symbol-evidence.mjs'
      - 'scripts/history/providers/yahoo-chart.mjs'
      - 'config/paris-follow-policy.json'
      - 'scripts/cloudflare/test-europe-provider-routing.mjs'
      - '.github/workflows/europe-routing-regression.yml'
  workflow_dispatch:
jobs:
  provider-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production script syntax
        run: |
          node --check scripts/history/provider-registry.mjs
          node --check scripts/cloudflare/daily-open-close-update.mjs
          node --check scripts/cloudflare/test-europe-provider-routing.mjs
          node --check scripts/cloudflare/audit-daily-open-close.mjs
          node --check scripts/cloudflare/reconcile-official-daily.mjs
          node --check scripts/cloudflare/paris-history-eligibility.mjs
          node --check scripts/cloudflare/test-paris-history-eligibility.mjs
          node --check scripts/cloudflare/europe-failure-diagnosis.mjs
          node --check scripts/cloudflare/test-europe-failure-diagnosis.mjs
          node --check scripts/cloudflare/summarize-europe-run.mjs
          node --check scripts/cloudflare/six-ipo-symbol-evidence.mjs
          node --check scripts/cloudflare/six-ipo-symbol-probe.mjs
          node --check scripts/cloudflare/test-six-ipo-symbol-evidence.mjs
          node --check scripts/history/providers/yahoo-chart.mjs
      - name: Test approved provider routing
        run: |
          node scripts/cloudflare/test-europe-provider-routing.mjs
          node scripts/cloudflare/test-paris-history-eligibility.mjs
          node scripts/cloudflare/test-europe-failure-diagnosis.mjs
          node scripts/cloudflare/test-six-ipo-symbol-evidence.mjs
