name: Europe OpenFIGI Yahoo independent evidence (read-only)
on:
  push:
    branches: [main]
    paths: ['config/openfigi-yahoo-verify-request.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: koersplein-openfigi-yahoo-evidence
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Test safe independent read-only identity evidence
        run: |
          node --check scripts/cloudflare/openfigi-yahoo-evidence.mjs
          node --check scripts/cloudflare/openfigi-yahoo-verification-probe.mjs
          node --check scripts/cloudflare/test-openfigi-yahoo-evidence.mjs
          node scripts/cloudflare/test-openfigi-yahoo-evidence.mjs
      - name: Retrieve successful OpenFIGI reference artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research/output
          SOURCE_RUN_ID=$(node -p "JSON.parse(require('fs').readFileSync('config/openfigi-yahoo-verify-request.json','utf8')).sourceRunId")
          test "$SOURCE_RUN_ID" -gt 0
          gh run download "$SOURCE_RUN_ID" --repo "${{ github.repository }}" --name openfigi-read-only-reference --dir research/output
          REF_FILE=$(find research/output -type f -name openfigi-reference-probe.json -print -quit)
          test -n "$REF_FILE"
          if [ "$REF_FILE" != 'research/output/openfigi-reference-probe.json' ]; then cp "$REF_FILE" research/output/openfigi-reference-probe.json; fi
          test -s research/output/openfigi-reference-probe.json
      - name: Validate selected Swiss/London candidates against Yahoo (no writes)
        run: node scripts/cloudflare/openfigi-yahoo-verification-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openfigi-yahoo-independent-evidence
          path: research/output/openfigi-yahoo-verification.json
          retention-days: 90
      - name: Report candidate evidence and remaining official-listing gate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS' > /tmp/openfigi-yahoo-report.md
          import fs from 'node:fs';
          console.log('### OpenFIGI → Yahoo onafhankelijke read-only identiteitscontrole');
          console.log('Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}');
          const p='research/output/openfigi-yahoo-verification.json';
          if(!fs.existsSync(p)){console.log('Geen validatie-artifact: controleer de workflowlogs.');process.exit(0);}
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          console.log('OpenFIGI bronrun:',r.sourceRunId,'| Gecontroleerde kandidaten:',r.selected,'van',r.eligibleReferences,'| Offset:',r.offset);
          console.log('Ambigue kandidaten apart gehouden:',r.ambiguousReferencesDeferred);
          for(const [status,count] of Object.entries(r.counts))console.log('- '+status+': '+count);
          const confirmed=r.results.filter(x=>x?.status==='YAHOO_VENUE_CURRENCY_OHLC_MATCH_OFFICIAL_ISIN_STILL_REQUIRED').slice(0,8);
          console.log('\\nMarkt/valuta/OHLC plausibel (GEEN productie-goedkeuring):');
          for(const x of confirmed)console.log('- '+x.mic+' '+x.isin+' => '+x.providerSymbol+' ('+x.observedCurrency+', laatste volledige bar '+x.latestCompleteDate+')');
          console.log('Geen catalogus-/historie-/prijswrites. Voor iedere promotie blijft een actuele officiële ISIN+MIC-noteringscontrole verplicht.');
          JS
          gh issue comment 205 --repo "${{ github.repository }}" --body-file /tmp/openfigi-yahoo-report.md
