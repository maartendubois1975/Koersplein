<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Koersplein Beheer</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0c;color:#f4f1e8;font:16px system-ui}.card{max-width:520px;margin:20px;padding:28px;border:1px solid #38332a;border-radius:18px;background:#171719}h1{color:#d9b45b}p{color:#b9b7b0;line-height:1.6}</style>
</head>
<body><main class="card"><h1>KOERSPLEIN BEHEER</h1><p id="state">Beveiligde beheeromgeving laden…</p></main>
<script>
fetch('../data/runtime-config.json',{cache:'no-store'}).then(r=>r.json()).then(config=>{
  if(!config.apiBaseUrl) throw new Error('Cloudflare is nog niet eenmalig gekoppeld. De publieke site en golden grafieken blijven beschikbaar; beheer wordt actief na het invullen van apiBaseUrl.');
  location.replace(String(config.apiBaseUrl).replace(/\/$/,'')+'/beheer');
}).catch(error=>document.querySelector('#state').textContent=error.message);
</script></body></html>
